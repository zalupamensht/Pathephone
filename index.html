      body.classList.add('is-stage');
      body.classList.add('is-landed');
      tryPlay();
      paintBtn();
      return;
    }

    /* le fond et la platine se levent ensemble, dans la meme respiration :
       ainsi tout est deja en place quand le disque se pose, et l atterrissage
       reste le seul temps fort, pas un troisieme sursaut separe */
    /* Tout se joue au contact : le fond reste noir jusque la, puis l onde
       claire part du disque et la scene nait avec elle.
       On ne declenche PAS sur un minuteur : si le navigateur prend du retard,
       le disque n a pas fini de tomber et l onde partirait a cote de lui. On
       attend la fin reelle du vol ; le minuteur ne sert que de filet. */
    var landed = false;

    function land(){
      if (landed) return;
      landed = true;

      /* Le centre de l onde est celui du disque lui meme, releve maintenant.
         Comme on arrive ici a la fin de son vol, il est sur le plateau ; et si
         le navigateur avait pris du retard, l onde partirait quand meme de la
         ou le disque se trouve vraiment, jamais a cote de lui. */
      if (fly){
        var r = fly.getBoundingClientRect();
        aimWave(r.left + r.width / 2, r.top + r.height / 2);
      }

      body.classList.add('is-landed');       // il se pose : le plateau tourne, le bras descend
      body.classList.add('is-open');         // l onde claire s ouvre depuis le point d impact
      body.classList.add('is-stage');        // la platine et le reste naissent avec l onde
      body.classList.add('is-hit');
      setTimeout(function(){ body.classList.remove('is-hit'); }, 240);
      tryPlay();                             // et la musique demarre au meme instant
      paintBtn();

      /* l onde a fini sa course : on retire les nappes pour rendre au fond
         ses teintes pastel */
      setTimeout(function(){ body.classList.add('is-lit'); }, 1000);
    }

    /* Le signe reste tel quel pendant le son du clic ; l animation part sur
       le coup sourd du « Bootup ». On suit la position reelle du son, pas
       une minuterie : s il a demarre en retard, l image l attend. S il ne
       joue pas du tout, un filet part a l heure.
       Si la piste d ouverture a un drop, elle part des le clic, entiere,
       depuis son debut : le coup du Bootup tombe alors sur un temps de la
       piste (drop - LAND), et le disque se pose pile sur le drop — l onde
       claire et la scene naissent avec les basses. C est alors la piste
       qu on suit pour lancer l animation. */
    var piste = ALB().tracks[trackIdx];
    var synchro = !!(piste && piste.drop && piste.audio && piste.drop * 1000 > LAND);
    var coup = synchro ? piste.drop - LAND / 1000 : BOUM;    // s apres le clic
    if (synchro){
      try { audio.currentTime = 0; } catch (e) {}
      wanted = true; tryPlay(); paintBtn();
    }
    var lance = false;
    function lancer(){
      if (lance) return;
      lance = true;
      body.classList.add('is-armed');        // le disque part du centre de l ecran
      if (REDUCED){
        setTimeout(land, LAND);              // sans vol, il n y a rien a attendre
      } else {
        eclipse();
        fly.addEventListener('animationend', function(e){
          if (e.animationName === 'flyin' || e.animationName === 'flyinsolo') land();
        });
        setTimeout(land, LAND + 700);        // filet, si l evenement ne vient pas
      }
    }
    /* On ne touche jamais a la vitesse de la piste pour la caler : revenir
       a la vitesse normale au moment du drop faisait claquer le son. Il n y
       en a pas besoin : l animation part sur la position reelle de la piste,
       le retard au demarrage du son est donc deja absorbe, et 4 s d image
       contre 4 s de son ne derivent pas. */

    var filet = setTimeout(lancer, coup * 1000 + 400);
    var guide = synchro ? audio : sonEclipse;
    (function guetter(){
      if (lance) return;
      /* une image d avance : le premier dessin tombe ainsi sur le coup */
      if (!guide.paused && guide.currentTime >= coup - .016){ clearTimeout(filet); lancer(); return; }
      requestAnimationFrame(guetter);
    })();
  }

  /* L eclipse : le film fait naitre l anneau, l eclat qui en fait le tour,
     puis le disque qui sort de l obscurite ; il s acheve sur le disque tel
     que la page le montre, et le vrai disque prend le relais (feuille de
     style). Si le film n est pas pret, le disque se revele seul, cerne de
     son simple trait de lumiere, comme avant. */
  var film = document.getElementById('eclipse');
  /* telecharge seulement la ou il sert : ordinateur, sans animations reduites */
  /* Le film ne sert qu aux albums qui ont une eclipse, et il ne doit pas
     prendre la ligne pendant que la page du choix charge ses images : il se
     telecharge des qu on s arrete sur un tel album (window.__filmEclipse,
     appele par le choix du disque), et tout de suite s il n y a pas de
     page de choix. */
  function chargerFilm(){
    if (!film || MOBILE || REDUCED || film.preload === 'auto') return;
    film.preload = 'auto'; film.load();
  }
  window.__filmEclipse = chargerFilm;
  if (!body.classList.contains('is-picking')) chargerFilm();
  function eclipse(){
    /* le film a ete tourne avec le disque d Unmusique : les autres albums se
       revelent par leur simple trait de lumiere */
    if (!ALB().eclipse || !film || film.readyState < 2 || getComputedStyle(film).display === 'none'){
      body.classList.add('sans-eclipse'); return;
    }
    try { film.currentTime = 0; } catch (e) {}
    /* le film a ete monte pour une intro de 4,2 s : on le joue au pas de LAND */
    film.playbackRate = film.defaultPlaybackRate = 4200 / LAND;
    var p = film.play();
    /* un vrai refus seulement : une lecture interrompue (AbortError) n en
       est pas un */
    if (p && p.catch) p.catch(function(err){
      if (!err || err.name !== 'AbortError') body.classList.add('sans-eclipse');
    });
  }

  /* Le depart : un clic sur le signe, ou la barre d espace. Rien d autre.
     Le signe s enfonce a l appui et reste enfonce tant qu on appuie ; la
     sequence part au relachement, comme sous le doigt un vrai bouton. */
  var signe = document.getElementById('introLogo');
  function enfoncer(){
    if (body.classList.contains('is-picking')) return;   // on est encore sur le choix du disque
    if (!started && signe) signe.classList.add('is-pressed');
  }
  function relacher(){ signe.classList.remove('is-pressed'); }
  function waitForGesture(){
    if (!signe) return;
    signe.addEventListener('pointerdown', function(e){ e.preventDefault(); enfoncer(); });
    signe.addEventListener('pointerleave', relacher);
    var survole_a = -1e9;
    signe.addEventListener('pointerenter', function(e){
      if (started || e.pointerType !== 'mouse') return;
      var now = performance.now();
      if (now - survole_a < 250) return;     // un passage qui tremble au bord ne rejoue pas
      survole_a = now;
      try { sonSurvolSigne.currentTime = 0; sonSurvolSigne.volume = audio.muted ? 0 : audio.volume; sonSurvolSigne.play().catch(function(){}); } catch (err) {}
    });
    window.addEventListener('pointerup', relacher);
    window.addEventListener('pointercancel', relacher);
    signe.addEventListener('click', function(){
      relacher();
      if (!started){ startIntro(); paintBtn(); }
    });
  }
  /* au clavier, le signe a le focus : Entree fait comme la barre d espace */
  if (signe) signe.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.repeat){ e.preventDefault(); enfoncer(); }
  });
  /* la barre d espace (ou Entree sur le signe) avant le depart : appui,
     puis depart au relachement */
  window.addEventListener('keyup', function(e){
    if (e.code !== 'Space' && e.key !== ' ' && e.key !== 'Enter') return;
    if (started || !signe || !signe.classList.contains('is-pressed')) return;
    relacher();
    startIntro(); paintBtn();
  });

  /* La barre d espace met en pause et relance.

     Trois pieges, tous evites ici.
     Le premier : le tout premier geste de la page arme l intro. Si ce geste
     est justement l espace, il doit lancer la musique et surtout pas la
     couper dans la foulee — d ou l instant du demarrage, compare a celui de
     la touche. Le poser avant waitForGesture ne suffisait pas : l ordre des
     ecouteurs n est pas une garantie qu on veut avoir a tenir.
     Le deuxieme : le mode reglage des paroles se sert deja de l espace pour
     poser les temps.
     Le troisieme : quand le bouton ou le curseur de volume ont le clavier,
     l espace leur appartient, et le navigateur en fera lui meme un clic ;
     agir en plus reviendrait a basculer deux fois. */
  window.addEventListener('keydown', function(e){
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (e.repeat) return;
    if (window.__lyricsTuning && window.__lyricsTuning()) return;

    var cible = e.target;
    if (cible && cible !== document.body){
      var t = (cible.tagName || '').toLowerCase();
      if (t === 'button' || t === 'input' || t === 'select' || t === 'textarea' ||
          cible.isContentEditable) return;
    }
    e.preventDefault();                       // sinon la page saute d un ecran

    if (!started){ enfoncer(); return; }             // le depart se fait au relachement
    if (performance.now() - demarre_a < 500) return;   // cette touche vient de tout lancer
    if (!body.classList.contains('is-landed')) return; // le disque n est pas encore pose
    if (!audio.getAttribute('src')) return;            // album sans fichiers

    annulerApresSon();
    if (audio.muted) audio.muted = false;  // meme raison que pour le volume
    if (audio.paused){ wanted = true; tryPlay(); }
    else { wanted = false; audio.pause(); }
    paintBtn();
  });

  waitForGesture();
  window.__startIntro = startIntro;

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if (!started) return;                  // on part du signe, pas d ici
    annulerApresSon();
    if (audio.muted) audio.muted = false;  // meme raison que pour le volume
    if (audio.paused){ wanted = true; tryPlay(); }
    else { wanted = false; audio.pause(); }
    paintBtn();
  });

  /* la piste est finie : on enchaine sur la suivante de l album, et apres la
     derniere on repart de la premiere. Le meme numero est force, sinon un
     album d une seule piste ne repartirait jamais. */
  audio.addEventListener('ended', function(){
    var list = ALB().tracks;
    if (!list.length) return;
    window.__playTrack((trackIdx + 1) % list.length, true);
  });

  audio.addEventListener('play', paintBtn);
  audio.addEventListener('pause', paintBtn);
  paintBtn();
})();

/* ---------------- le choix du disque ---------------- */
/* Un disque au centre, et sa musique qui joue deja, comme sous l eau : on
   n en garde que le bas, avec un peu d echo. Au bout de DWELL passe sur le
   meme disque, il file dans sa pochette et le monde de l album s ouvre —
   son fond defile comme sur la PS5, sa bande de vignettes. Les fleches (ou
   <- ->) passent au disque voisin avec le son de defilement des pistes ;
   chaque disque reprend sa musique la ou on l avait laissee. Un clic sur
   le disque ou la pochette (ou Entree), avec le son de choix : il roule
   jusqu au milieu, prend son elan et s en va par la droite en emportant
   l ecran.
   L ecran d accueil de cet album suit — ou l album lui meme, s il n a pas
   encore d ecran d accueil. */
/* ---- Les pistes se preparent avant d etre choisies ----
   Une piste ne commencait a venir qu au clic : on attendait, et pendant ce
   temps le fond anime n avait plus de ligne pour lui. Desormais une piste
   sur laquelle le curseur s attarde (un quart de seconde) se telecharge
   deja, et quand la piste en cours est entierement la, la suivante vient
   a son tour. Une seule a la fois, en basse priorite ; une piste survolee
   remplace celle qui se preparait. Pas sur telephone ni en economie de
   donnees : ce serait du forfait depense pour rien. */
(function(){
  if (MOBILE) return;
  var co = navigator.connection;
  if (co && (co.saveData || /2g/.test(co.effectiveType || ''))) return;
  var theme = document.getElementById('theme');
  var pret = {}, encours = null, tSurvol = 0;

  function charger(url){
    if (!url || pret[url]) return;
    if (encours){
      if (encours.url === url) return;
      encours.ctl.abort();
    }
    var ctl = new AbortController(), ici = { url: url, ctl: ctl };
    encours = ici;
    fetch(url, { signal: ctl.signal, priority: 'low' })
      .then(function(r){ return r.ok ? r.blob() : null; })
      .then(function(b){ if (b) pret[url] = true; })
      .catch(function(){})
      .then(function(){ if (encours === ici) encours = null; });
  }

  window.__prechargerPiste = charger;
  document.addEventListener('mouseover', function(e){
    var trk = e.target && e.target.closest ? e.target.closest('.trk') : null;
    clearTimeout(tSurvol);
    if (!trk || trk.dataset.i == null) return;
    var t = ALB().tracks[+trk.dataset.i];
    tSurvol = setTimeout(function(){ charger(t && t.audio); }, 250);
  });

  /* la piste en cours est toute la : on prepare celle d apres */
  theme.addEventListener('progress', function(){
    var src = theme.getAttribute('src'), d = theme.duration;
    if (!src || !d || !theme.buffered.length) return;
    if (theme.buffered.end(theme.buffered.length - 1) < d - .5) return;
    pret[src] = true;
    var pistes = ALB().tracks, i = -1;
    for (var k = 0; k < pistes.length; k++) if (pistes[k].audio === src){ i = k; break; }
    if (i >= 0 && pistes[i + 1]) charger(pistes[i + 1].audio);
  });
})();

/* ---- Les rouages du fond de « C » ----
   Le film dure trois secondes et donne un a-coup par seconde : repos,
   puis le tour de roue de .47 a .80, puis un petit amorti. C est la FIN du
   tour qui est posee sur le temps (ARRIVEE) : le rouage tourne juste avant
   le clap et s arrete dessus, l amorti faisant rebond. On ne se contente pas de sa
   vitesse : a chaque image on calcule ou il devrait en etre pour que
   l a-coup tombe sur le temps du morceau, et on le rattrape doucement (ou
   d un saut, s il s est trop ecarte). Au dela de 100 bpm, un a-coup tous
   les deux temps : sinon les rouages s agitent au lieu de battre. */
(function(){
  var film = document.getElementById('cryptFilm');
  if (!film || MOBILE) return;
  var corps = document.body;
  var CYCLE = 3, ARRIVEE = .82;          // fin du tour de roue, dans chaque seconde du film
  var charge = false, dernier = 0;
  /* Le film se telecharge d avance : des qu on s attarde sur « C » dans le
     choix du disque (voir ce module-la). Ainsi, quand on choisit l album,
     il est deja la et tourne des le glissement, avec la musique ; sinon
     les rouages restaient immobiles pendant que la piste demarrait. */
  function charger(){
    if (charge) return;
    charge = true;
    if (film.preload !== 'auto'){ film.preload = 'auto'; film.load(); }
  }
  window.__prechargerRouages = charger;
  function ici(){
    if (!corps.classList.contains('alb-crypt')) return false;
    if (!corps.classList.contains('is-stage') && !corps.classList.contains('is-lighten')) return false;
    if (!corps.classList.contains('is-picking')) return true;
    /* pendant que le choix glisse : seulement si le film est deja pret —
       le lancer ne coute alors que le decodage, fait par la carte graphique.
       Le telecharger a ce moment la, lui, ferait accrocher l animation. */
    return corps.classList.contains('is-sortie') && film.readyState >= 3;
  }
  function tour(){
    requestAnimationFrame(tour);
    if (!ici()){
      if (!film.paused){ try { film.pause(); } catch (e) {} }
      return;
    }
    charger();                                   // si on est arrive sans passer par le choix
    var info = window.__trackInfo ? window.__trackInfo() : null;
    if (!info || !info.joue){ if (!film.paused) film.pause(); return; }
    if (film.readyState < 2) return;
    if (film.paused) film.play().catch(function(){});
    /* on ne retouche la vitesse que cinq fois par seconde : la changer a
       chaque image faisait hacher la lecture */
    var maintenant = performance.now();
    if (maintenant - dernier < 200) return;
    dernier = maintenant;
    var bpm = info.bpm || 100;
    var parCoup = bpm > 100 ? 2 : 1;                       // temps par a-coup
    var base = bpm / (60 * parCoup);
    var coups = (info.temps - (info.phase || 0)) * bpm / 60 / parCoup;
    var cible = ((coups + ARRIVEE) % CYCLE + CYCLE) % CYCLE;
    var ecart = cible - film.currentTime;
    if (ecart > CYCLE / 2) ecart -= CYCLE;
    if (ecart < -CYCLE / 2) ecart += CYCLE;
    /* un saut coute un decodage : on ne saute que si l ecart est franc
       (debut de piste, retour en arriere) ; le reste se rattrape en vitesse */
    if (Math.abs(ecart) > .6){ try { film.currentTime = cible; } catch (e) {} return; }
    var r = base * (1 + Math.max(-.06, Math.min(.06, ecart * .4)));
    if (Math.abs(film.playbackRate - r) > .004){ try { film.playbackRate = r; } catch (e) {} }
  }
  requestAnimationFrame(tour);
})();

/* ---- Les films de fond menes par le tempo ----
   Un film en boucle, monte sur un morceau : sa boucle dure un nombre juste
   de temps. Pour chaque piste ou il parait, sa boucle est calee sur celle du
   morceau a partir du premier temps — le film va un peu plus vite ou plus
   lentement, et ses coupes tombent sur les temps. Sous 100 bpm on compte en
   double temps. Comme pour les rouages de « C », on rattrape en vitesse, et
   on ne saute que si l ecart est franc.
     theme    : l album (classe alb-...)
     classe   : posee sur body tant que le film est visible
     pistes   : les morceaux ou il parait (null : tout l album)
     origine  : le morceau sur lequel il a ete monte, dont l instant 0 est
                l image 0 (null : on part du premier temps de la piste)
     temps    : la longueur de la boucle, en temps
   Che : monte sur Tuesday, seize mesures, sur tout l album.
   psykotic : monte sur Get Away, quatre mesures, sur tout l album. */
function filmDeFond(o){
  var film = document.getElementById(o.id);
  if (!film || MOBILE) return null;
  var corps = document.body, dernier = 0;
  function charger(){
    if (film.preload !== 'auto'){ film.preload = 'auto'; film.load(); }
  }
  function tour(){
    requestAnimationFrame(tour);
    var info = window.__trackInfo ? window.__trackInfo() : null;
    /* sur la page, ou deja pendant que le choix s en va */
    var scene = corps.classList.contains('alb-' + o.theme) &&
      (corps.classList.contains('is-stage') || corps.classList.contains('is-lighten')) &&
      (!corps.classList.contains('is-picking') || corps.classList.contains('is-sortie'));
    if (scene) charger();                              // pret avant qu on arrive au morceau
    var arrivee = corps.classList.contains('is-picking') || !corps.classList.contains('is-landed');
    var ouvre = ALB().tracks[ALB().start];
    var nom = arrivee && ouvre ? ouvre.name : (info && info.nom);   // a l arrivee : la piste qui ouvre
    var ici = scene && (!o.pistes || o.pistes.indexOf(nom) >= 0);
    corps.classList.toggle(o.classe, !!ici);
    /* elan : le film ne reste pas fige sur sa premiere image pendant que la
       page s ouvre (elle ressemblait a une photo) ; il part tout de suite,
       des la fin de sa boucle, et arrive a l image 0 avec la musique */
    if (o.elan && ici && arrivee){
      if (film.paused && film.readyState >= 2 && !film.dataset.elan){
        film.dataset.elan = '1';
        /* la musique deja partie (choix rapide, film pas encore charge) :
           on la rejoint directement */
        var va = info && info.joue ? info.temps % film.duration : film.duration - o.elan;
        try { film.playbackRate = 1; film.currentTime = Math.max(0, va); } catch (e) {}
        film.play().catch(function(){});
      }
      return;
    }
    if (!arrivee) delete film.dataset.elan;
    if (!ici || !info || !info.joue || arrivee || (o.pistes && o.pistes.indexOf(info.nom) < 0)){
      if (!film.paused){ try { film.pause(); } catch (e) {} }
      return;
    }
    if (film.readyState < 2 || film.seeking) return;   // un saut en cours : on le laisse finir
    if (film.paused) film.play().catch(function(){});
    var maintenant = performance.now();
    if (maintenant - dernier < 200) return;
    dernier = maintenant;
    var bpm = info.bpm || 120;
    if (bpm < 100) bpm *= 2;                           // double temps
    var depart = info.nom === o.origine ? 0 : (info.phase || 0);
    var cycle = o.temps * 60 / bpm;
    var duree = film.duration || cycle, base = duree / cycle;   // le fichier est etire a la boucle
    var cible = (((info.temps - depart) % cycle + cycle) % cycle) * base;
    var ecart = cible - film.currentTime;
    if (ecart > duree / 2) ecart -= duree;
    if (ecart < -duree / 2) ecart += duree;
    /* on saute un peu en avant : le temps de decoder, la musique aura avance */
    if (Math.abs(ecart) > .35){
      try { film.currentTime = (cible + .06 * base) % duree; } catch (e) {}
      dernier = maintenant + 300;                   // et on le laisse repartir avant de juger
      return;
    }
    var r = base * (1 + Math.max(-.06, Math.min(.06, ecart * .4)));
    if (Math.abs(film.playbackRate - r) > .004){ try { film.playbackRate = r; } catch (e) {} }
  }
  requestAnimationFrame(tour);
  return charger;
}
window.__prechargerTuesday = filmDeFond({ id:'cheFilm', theme:'che', classe:'is-film-che',
  pistes:null, origine:'Tuesday', temps:64 });
window.__prechargerPsy = filmDeFond({ id:'psyFilm', theme:'psy', classe:'is-film-psy',
  pistes:null, origine:null, temps:16 });
/* Nettspend : le montage dure tout « you ready? » (73 bpm, compte en double) */
window.__prechargerNett = filmDeFond({ id:'nettFilm', theme:'nett', classe:'is-film-nett',
  pistes:['you ready?'], origine:'you ready?', elan:1, temps:360.863 });
/* et sa version demoniaque, sur les pistes sales (pour l instant : sick) */
window.__prechargerNettD = filmDeFond({ id:'nettFilmD', theme:'nett', classe:'is-film-nettd',
  pistes:['sick'], origine:null, temps:360.863 });

(function(){
  var pk = document.getElementById('picker');
  if (!pk || !PICKER) return;
  var body = document.body;
  var hit = document.getElementById('pkHit'), disc = document.getElementById('pkDisc');
  var album = document.getElementById('pkAlbum');
  var sleeve = document.getElementById('pkSleeve'), info = document.getElementById('pkInfo');
  var strip = document.getElementById('pkStrip');

  var DWELL = 40;                        // ms avant que le fond de l album parte
  var SLIDE = 5000;                      // ms par image du fond
  var COUPE = 480;                       // Hz : au dessus, le son est retire (sous l eau)
  var VOL = .84;                         // part du volume du site
  var BAS = 260;                         // Hz : les graves coupes en dessous (0 = rien)
  var ECHO = .35;                        // part d echo
  var ROULE = 1200;                      // ms : le disque roule jusqu au milieu (un tour)
  var ELAN = 260;                        // ms : le petit retour en arriere
  var SORTIE = 1150;                     // ms : il s en va et emporte l ecran

  /* ce qui defile en fond quand l album s ouvre : des images, et des films
     (.mp4) glisses entre elles, qui passent en entier avant l image
     suivante. th : la vignette de la bande du bas (pour un film, une belle
     image tiree de lui). Jane et matt proxy : images de passage.
     jp : une ligne d une de ses chansons, en japonais, et d ou elle vient. */
  var PK = [
    { from:5, gain:1, meta:'17 tracks',
      jp:'運なんてない。ただ、愛するものに夢中なだけ。', de:'Tout Naturel',
      media:[{ src:'assets/lucy_bg1.mp4', th:'assets/lucy_th1.webp' },

      if (v && v.readyState >= 2 && v.currentTime > 0) v.classList.add('is-la');
      else l.classList.remove('on');
    });
    if (window.__ui) window.__ui('select', true);
    if (liste && !liste.hidden) fermerListe();   // la liste ne reste pas ouverte
    /* tout le reste — la pochette, les voisins, le monde de l album, les
       fleches, la bande, le volume — descend simplement dans le vide ;
       il ne reste que le disque et le fond nu */
    pk.classList.add('is-part');           // plus rien ne repond au clic
    son.sombrer((ROULE + ELAN + SORTIE) / 1000);

    /* l album s arrete la ou il est, meme en plein glissement */
    var ou = getComputedStyle(album).transform;
    album.style.transition = 'none';
    album.style.transform = ou;

    /* le disque est deja un peu sorti de sa pochette (la souris est dessus) :
       on reprend sa position exacte, sinon il sauterait en arriere au depart */
    var sink = hit.querySelector('.pk-sink');
    var m = getComputedStyle(sink).transform, tx0 = 0;
    if (m && m.indexOf('matrix') === 0) tx0 = parseFloat(m.slice(m.indexOf('(') + 1).split(',')[4]) || 0;
    var r = hit.getBoundingClientRect(), gauche = r.left - tx0;   // sa place au repos
    var dx = innerWidth / 2 - (gauche + r.width / 2);     // jusqu au milieu
    if (dx < r.width * .3) dx = r.width * .3;             // toujours vers la droite
    sink.style.transition = 'none';
    sink.style.transform = 'translateX(' + tx0.toFixed(1) + 'px)';

    /* 1. un tour, et il s arrete au milieu */
    requestAnimationFrame(function(){
      sink.style.transition = 'transform ' + ROULE + 'ms cubic-bezier(.22,.8,.26,1)';
      sink.style.transform = 'translateX(' + dx.toFixed(1) + 'px) rotate(360deg)';
    });

    /* 2. l elan : il revient un peu en arriere */
    setTimeout(function(){
      sink.style.transition = 'transform ' + ELAN + 'ms cubic-bezier(.4,0,.5,1)';
      sink.style.transform = 'translateX(' + (dx - r.width * .07).toFixed(1) + 'px) rotate(332deg)';
    }, ROULE + 60);

    /* 3. il repart, et l ecran s en va avec lui */
    setTimeout(function(){
      decouvrir();
      var loin = innerWidth - gauche + r.width * .4;
      sink.style.transition = 'transform ' + SORTIE + 'ms cubic-bezier(.5,0,.4,1)';
      sink.style.transform = 'translateX(' + loin.toFixed(1) + 'px) rotate(' + (332 + 900) + 'deg)';
      pk.style.transition = 'transform ' + SORTIE + 'ms cubic-bezier(.5,0,.4,1)';
      pk.style.transform = 'translateX(100%)';
    }, ROULE + ELAN + 60);

    setTimeout(fini, ROULE + ELAN + SORTIE + 120);
  }
  /* la page de l album apparait sous le choix, qui glisse par dessus elle */
  function decouvrir(){
    if (cur !== CUR_ALBUM && window.__setAlbum) window.__setAlbum(cur, 0, true);
    var accueil = !!ALBUMS[cur].accueil;
    if (ALBUMS[cur].eclipse && window.__filmEclipse) window.__filmEclipse();
    if (!accueil) body.classList.add('is-direct');
    body.classList.add('is-sortie');       // la page se montre, le choix la couvre encore
    if (accueil){ if (window.__ambianceGo) window.__ambianceGo(); }
    else {
      /* psykotic : son intro (le couteau) se pose par-dessus, la page se
         prepare dessous et sa musique attend le drop */
      if (ALBUMS[cur].theme === 'psy' && window.__psyIntro) window.__psyIntro();
      if (ALBUMS[cur].theme === 'nett' && window.__nettIntro) window.__nettIntro();
      if (window.__startIntro) window.__startIntro(true);
    }
  }
  /* l ecran du choix a fini de partir : on le retire */
  function fini(){
    body.classList.remove('is-picking', 'is-sortie');
    son.dormir();
    pk.style.transition = 'none';
    pk.style.transform = '';
  }

  hit.addEventListener('click', plonger);
  sleeve.addEventListener('click', plonger);
  document.getElementById('pkNext').addEventListener('click', function(e){ e.stopPropagation(); feuilleter(1); });
  document.getElementById('pkPrev').addEventListener('click', function(e){ e.stopPropagation(); feuilleter(-1); });
  document.getElementById('pkUp').addEventListener('click', function(e){ e.stopPropagation(); feuilleter(-1); });
  document.getElementById('pkDown').addEventListener('click', function(e){ e.stopPropagation(); feuilleter(1); });
  barres.addEventListener('click', function(e){ e.stopPropagation(); bascule(); });
  liste.addEventListener('click', function(e){ e.stopPropagation(); });
  pk.addEventListener('click', function(){ if (pk.classList.contains('is-liste')) fermerListe(); });

  /* la molette : un album par geste, quelle que soit sa force. Le geste dure
     tant que les crans arrivent (l elan d un trackpad ou d une Magic Mouse
     compris) ; il faut un vrai silence pour en commencer un autre. Rien ne
     s accumule pendant que l album change */
  var roue = 0, tRoue = 0, roueLibre = true;
  pk.addEventListener('wheel', function(e){
    if (parti || !body.classList.contains('is-picking')) return;
    e.preventDefault();
    clearTimeout(tRoue);
    tRoue = setTimeout(function(){ roue = 0; roueLibre = true; }, 220);
    if (!roueLibre) return;
    roue += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(roue) < 8) return;
    var d = roue > 0 ? 1 : -1; roue = 0; roueLibre = false;
    if (!occupe) feuilleter(d);
  }, {passive: false});

  window.addEventListener('keydown', function(e){
    if (parti || !body.classList.contains('is-picking')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!e.repeat) feuilleter(e.key === 'ArrowDown' ? 1 : -1);
    } else if (e.key === 'Escape'){
      if (pk.classList.contains('is-liste')){ e.preventDefault(); fermerListe(); }
    } else if (e.key === 'Enter'){
      /* une fleche, les barres ou la liste ont le clavier : la touche leur appartient */
      var t = e.target;
      if (t && t.classList && (t.classList.contains('pk-arrow') || t.classList.contains('pk-menu') ||
          t.classList.contains('pk-ligne') || t.classList.contains('pk-peek') ||
          t.classList.contains('pk-tile'))) return;
      e.preventDefault();
      if (!e.repeat) plonger();
    }
  });
  /* un clic dans le vide ne selectionne rien */
  pk.addEventListener('mousedown', function(e){ if (e.target === pk) e.preventDefault(); });

  /* ---- la musique sous l eau ----
     un lecteur a part, branche dans un petit circuit : trois filtres passe
     bas a la suite (une pente raide : sinon les aigus d un morceau brillant
     passent encore et grincent), un echo fait maison, puis le volume. Elle
     joue sans s arreter ; chaque album garde sa place dans son morceau.
     Le navigateur n ouvre le son qu apres un geste (sauf sur un site ou
     l on ecoute souvent) : le circuit est monte tout de suite, et s il
     reste muet la musique part au premier clic ou a la premiere touche. */
  var son = (function(){
    var lecteur = new Audio(); lecteur.preload = 'auto'; lecteur.loop = true;
    var ctx = null, maitre = null, filtres = [], voulu = false, arret = 0, charge = -1;
    var places = {};                               // ou en etait chaque album
    function monter(){
      if (ctx) return;
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      var src = ctx.createMediaElementSource(lecteur);
      var prec = src;
      /* PROVISOIRE (pour filmer) : les graves partent. Sur les petits
         haut parleurs d un portable ils ne sortent pas en note mais en
         souffle, et ils salissent tout le reste. Mettre BAS a 0 pour les
         rendre. */
      if (BAS){
        var hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = BAS; hp.Q.value = .7071;
        prec.connect(hp); prec = hp; filtres.push(hp);
      }
      var qs = [.5176, .7071, 1.9319];                      // un Butterworth d ordre 6
      qs.forEach(function(q){
        var f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = COUPE; f.Q.value = q;
        prec.connect(f); prec = f; filtres.push(f);
      });
      var sec = ctx.createGain(), mouille = ctx.createGain(), ech = ctx.createConvolver();
      var n = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (var c = 0; c < 2; c++){
        var d = ir.getChannelData(c);
        for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      }
      ech.buffer = ir;
      sec.gain.value = 1 - ECHO * .35; mouille.gain.value = ECHO * .9;
      maitre = ctx.createGain(); maitre.gain.value = 0;
      prec.connect(sec); prec.connect(ech); ech.connect(mouille);
      sec.connect(maitre); mouille.connect(maitre); maitre.connect(ctx.destination);
    }
    function niveau(){
      if (theme && theme.muted) return 0;                 // le son est coupe
      return VOL * PK[cur].gain * (theme ? theme.volume : .85);
    }
    function rampe(v, sec){
      var tt = ctx.currentTime;
      maitre.gain.cancelScheduledValues(tt);
      maitre.gain.setValueAtTime(maitre.gain.value, tt);
      maitre.gain.linearRampToValueAtTime(v, tt + sec);
    }
    function jouer(){
      voulu = true;
      clearTimeout(arret);
      /* piste : celle qui joue dans le choix, si l album en veut une autre
         que sa piste d ouverture ; la page de l album, elle, n en change pas */
      var a = ALBUMS[cur], t = a.tracks[PK[cur].piste != null ? PK[cur].piste : a.start];
      if (!t || !t.audio) return;
      if (charge !== cur){
        /* on quitte un album : on retient ou il en etait */
        /* un fichier pas encore charge est a 0 : retenir ce 0 aurait fait
           repartir l album de son tout debut au lieu de son point de depart */
        if (charge >= 0 && lecteur.readyState >= 1 && lecteur.currentTime > .05) places[charge] = lecteur.currentTime;
        charge = cur;
        lecteur.src = t.audio;
        /* un fichier pas encore charge ignore qu on le place : on attend
           d en connaitre la duree */
        var depuis = places[cur] != null ? places[cur] : PK[cur].from;
        lecteur.addEventListener('loadedmetadata', function placer(){
          lecteur.removeEventListener('loadedmetadata', placer);
          try { lecteur.currentTime = depuis; } catch (e) {}
        });
      }
      if (!ctx) return;
      if (ctx.state !== 'running') ctx.resume();
      rampe(niveau(), 1.8);
      lecteur.play().catch(function(){});
    }
    function couper(sec){
      voulu = false;
      if (!ctx){ lecteur.pause(); return; }
      rampe(0, sec);
      clearTimeout(arret);
      arret = setTimeout(function(){ if (!voulu) lecteur.pause(); }, sec * 1000 + 80);
    }
    /* la plongee : le son s enfonce avec le disque, de plus en plus sourd */
    function sombrer(sec){
      if (!ctx){ lecteur.pause(); return; }
      var tt = ctx.currentTime;
      filtres.forEach(function(f){
        f.frequency.cancelScheduledValues(tt);
        f.frequency.setValueAtTime(f.frequency.value, tt);
        f.frequency.exponentialRampToValueAtTime(120, tt + sec);
      });
      couper(sec);
    }
    function geste(e){
      if (!body.classList.contains('is-picking')){ fin(); return; }
      /* ce geste ci va faire plonger le disque : inutile de lancer la
         musique pour l eteindre aussitot */
      var t = e && e.target;
      if (t && t.nodeType === 1 && (hit.contains(t) || t === sleeve)) return;
      monter();
      if (!ctx) return;
      if (ctx.state !== 'running') ctx.resume().then(function(){ if (voulu) jouer(); });
      else if (voulu && lecteur.paused) jouer();
    }
    function fin(){ ['pointerdown', 'keydown'].forEach(function(g){ window.removeEventListener(g, geste, true); }); }
    ['pointerdown', 'keydown'].forEach(function(g){ window.addEventListener(g, geste, true); });
    /* le circuit tout de suite : si le navigateur laisse deja jouer, la
       musique part avec la page */
    monter();
    /* le curseur de volume vient de bouger */
    function regler(){ if (ctx && voulu) rampe(niveau(), .08); }
    /* la page du choix est partie : le circuit n a plus rien a rendre */
    function dormir(){ if (ctx && ctx.state === 'running') ctx.suspend().catch(function(){}); }
    return { jouer: jouer, couper: couper, sombrer: sombrer, regler: regler, dormir: dormir, etat: function(){
      return { joue: !lecteur.paused, temps: +lecteur.currentTime.toFixed(2), piste: lecteur.getAttribute('src'),
               circuit: ctx ? ctx.state : null, niveau: maitre ? +maitre.gain.value.toFixed(3) : 0 };
    } };
  })();

  /* le curseur de volume : il regle le site entier, l apercu compris, et
     la page de l album le retrouve tel quel */
  var volSite = document.getElementById('vol');
  curseur.value = Math.round((theme.volume != null ? theme.volume : .85) * 100);
  curseur.style.setProperty('--v', curseur.value + '%');
  curseur.addEventListener('input', function(){
    var v = curseur.value / 100;
    theme.volume = v;
    curseur.style.setProperty('--v', curseur.value + '%');
    if (volSite){ volSite.value = curseur.value; volSite.style.setProperty('--v', curseur.value + '%'); }
    son.regler();
  });
  curseur.addEventListener('keydown', function(e){ e.stopPropagation(); });   // les fleches restent au curseur
  /* une seule touche pour couper le son : elle vaut pour tout le site, et
     le curseur garde sa place, pour la retrouver en le rallumant */
  function peindreMuet(){
    var m = !!theme.muted;
    pk.classList.toggle('is-muet', m);
    muet.setAttribute('aria-pressed', m ? 'true' : 'false');
    muet.setAttribute('aria-label', m ? 'Sound on' : 'Sound off');
  }
  muet.addEventListener('click', function(e){
    e.stopPropagation();
    theme.muted = !theme.muted;
    peindreMuet();
    son.regler();
  });
  muet.addEventListener('keydown', function(e){ e.stopPropagation(); });
  peindreMuet();

  /* « Menu » sur la page d un album : retour au choix du disque, sur cet
     album. Pour l instant un simple fondu ; l animation viendra plus tard. */
  var menuBtn = document.getElementById('menuBtn');
  if (menuBtn) menuBtn.addEventListener('click', function(e){
    e.stopPropagation();
    body.classList.add('is-quitte');
    setTimeout(function(){ location.href = location.pathname + '?menu=' + CUR_ALBUM; }, 320);
  });

  remplir(cur);
  son.jouer();
  attendre();
  window.__picker = function(){ return { album: cur, ouvert: pk.classList.contains('is-open'), parti: parti, son: son.etat() }; };
})();
</script>

<script>
/* L intro de psykotic, a chaque entree dans l album (depuis le choix).
   Le noir ; un couteau par terre : on passe dessus, il remplace la souris.
   Un pointille fin montre le cercle a tracer, a la place du disque : la
   pointe y laisse un anneau de sang. Puis « STAB ×3 » : la pointe reste
   attachee au centre, le manche suit la souris, on frappe d ou on veut
   (1 le vinyle, 2 l etiquette, 3 le cercle coule). Apres le troisieme, la
   souris se detache ; le couteau, seul, frappe trois fois sur les temps de
   Get Away (1 la page apparait, figee ; 2 le sang plein ecran ; 3 encore
   plus), et une quatrieme sur le drop : il vole en eclats, la musique part,
   tout s efface lentement, du centre vers les bords.
   La page est prete dessous des le debut : la musique est seulement
   retenue (window.__psyRetenu) jusqu au drop. « skip » coupe tout. */
(function(){

  var $ = function(id){ return document.getElementById(id); };
  var noir = $('psyiNoir'), couches = $('psyiCouches'), disque = $('psyiDisque');
  var bas = $('psyiBas'), haut = $('psyiHaut'), flash = $('psyiFlash');
  var consigne = $('psyiConsigne'), prendre = $('psyiPrendre');
  var sang = $('psyiSang'), sang2 = $('psyiSang2');

  if (/AppleWebKit/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox|FxiOS/.test(ua))
    gicl.forEach(function(v){ v.src = v.getAttribute('src').replace(/\.webm$/, '.mov'); });
  var BEAT = 60 / 153;
  var coupe = null;                 // le bruit de la lame : la chair (Flesh Growing), le mouille dessous
  var fond = null;                  // l ambiance : elle monte jusqu au drop, puis s efface

     sur psykotic dans le choix (comme son film), ou au plus tard a l entree */
  var precharge = false;
  function precharger(){
    if (precharge) return;
    precharge = true;
    K_IMG.src = 'assets/psyi_couteau.webp'; C_IMG.src = 'assets/psyi_cercle.webp';
    [disque, sang, sang2].forEach(function(im){ if (!im.getAttribute('src')) im.src = im.dataset.src; });
    coupe = new Audio('assets/psyi_coupe.mp3?v=2'); coupe.loop = true; coupe.preload = 'auto';
    fond = new Audio('assets/psyi_fond.mp3'); fond.loop = true; fond.preload = 'auto';
    TACHES.forEach(function(u){ new Image().src = u; });
    ['assets/psyi_coup1.mp3', 'assets/psyi_coup2.mp3'].forEach(function(u){ var a = new Audio(); a.preload = 'auto'; a.src = u; });
    gicl.forEach(function(v){ v.preload = 'auto'; try { v.load(); } catch (x) {} });
  }
  window.__psyiPrecharger = precharger;
  var K_IMG = new Image(), C_IMG = new Image();   // charges seulement quand psykotic est choisi
  // le couteau : pointe et bout du manche dans l image (405 x 557)
  var K_POINTE = [0.5, 556], K_MANCHE = [393.5, 8];
  var K_LONG = Math.hypot(K_MANCHE[0] - K_POINTE[0], K_MANCHE[1] - K_POINTE[1]);
  var K_AXE = Math.atan2(K_MANCHE[1] - K_POINTE[1], K_MANCHE[0] - K_POINTE[0]);
  var POSE = -47.8 * Math.PI / 180;            // la pose de base : manche en haut a droite

  var g = {};                                   // la geometrie (le disque de la page)
  function mesurer(){
    var r = document.getElementById('discFly').getBoundingClientRect();
    g.cx = r.left + r.width / 2; g.cy = r.top + r.height / 2;
    /* a l ecran, le disque de la page est dessine a 91,2 % de sa boite
       (bord rouge a 148 px pour une boite de 330, etiquette a l avenant) */
    g.D = r.width * .912;
    g.R = g.D / 2 * .983;                       // le bord rouge (254 px sur 260 de rayon dans l image)
    g.f = g.R / 148;                            // l echelle des reglages, faits a R = 148
    g.dpr = window.devicePixelRatio || 1;
    [bas, haut].forEach(function(c){
      c.width = Math.round(innerWidth * g.dpr); c.height = Math.round(innerHeight * g.dpr);
    });
    var D = g.D;
    disque.style.width = disque.style.height = D + 'px';
    disque.style.left = (g.cx - D / 2) + 'px'; disque.style.top = (g.cy - D / 2) + 'px';
    consigne.style.left = g.cx + 'px'; consigne.style.top = (g.cy + g.R + 52 * g.f) + 'px';
    consigne.style.fontSize = (28 * g.f) + 'px';
    gicl.forEach(placerGiclee);
  }
  function placerGiclee(v){
    var t = parseFloat(v.dataset.taille || 1);
    var w = 1600 * g.f * t, h = 1000 * g.f * t;
    v.style.width = w + 'px'; v.style.height = h + 'px';
    v.style.left = (g.cx - w / 2) + 'px'; v.style.top = (g.cy - h / 2) + 'px';
  }

  /* ------------------------------------------------------------ l etat */
  var e = null;                                 // l intro en cours
  var souris = { x: -999, y: -999 };
  function lisse(u){ u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  function main(t, a){ return Math.sin(t * 9.1) * a + Math.sin(t * 23.7) * a * .5; }
  function maint(){ return performance.now() / 1000; }

  function son(n, fort){
    (window.__psyiJournal = window.__psyiJournal || []).push(['son', n, fort ? 1 : 0, Date.now() / 1000]);
    var a = new Audio(n === 1 ? 'assets/psyi_coup1.mp3' : 'assets/psyi_coup2.mp3');
    var th = $('theme');
    a.volume = th && th.muted ? 0 : Math.min(1, (th ? th.volume : 1) * (fort ? 1 : .85));
    a.play().catch(function(){});
  }
  function eclair(fort){
    flash.style.opacity = fort ? .22 : .1;
    setTimeout(function(){ flash.style.opacity = 0; }, 45);
    var fin = maint() + (fort ? .12 : .06), a = fort ? 12 : 4;
    (function sec(){
      if (maint() > fin){ couches.style.transform = ''; return; }
      couches.style.transform = 'translate(' + ((Math.random() * 2 - 1) * a).toFixed(1) + 'px,' + ((Math.random() * 2 - 1) * a).toFixed(1) + 'px)';
      requestAnimationFrame(sec);
    })();
  }
  /* des taches de sang sur l ecran, partout (pas seulement autour du
     disque) : posees d un coup, une petite secousse a l arrivee. Trois
     taches tirees des clips FX Elements, en miroir, tournees, a tailles
     variees ; celle qui coule (2) reste debout. */
  var TACHES = ['assets/psyi_tache0.webp', 'assets/psyi_tache1.webp', 'assets/psyi_tache2.webp'];
  function tacheIci(x, y, taille){
    var im = document.createElement('img');
    im.className = 'psyi-tache'; im.src = TACHES[1]; im.alt = '';
    var l = 360 * g.f * taille, rot = Math.random() * 360;
    im.style.width = l + 'px'; im.style.left = (x - l / 2) + 'px'; im.style.top = (y - l / 2) + 'px';
    im.style.transform = 'rotate(' + rot.toFixed(1) + 'deg) scale(1.1)';
    couches.insertBefore(im, flash);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ im.style.transform = 'rotate(' + rot.toFixed(1) + 'deg)'; }); });
  }
  function tacher(n, taille, pres){
    var W = innerWidth, H = innerHeight, poses = e.taches;
    for (var k = 0; k < n; k++){
      var x, y, essai = 0;
      do {
        if (pres){                                  // autour du disque, tout pres
          var an = Math.random() * 2 * Math.PI, d = (1.15 + Math.random() * 1.2) * g.R;
          x = g.cx + Math.cos(an) * d; y = g.cy + Math.sin(an) * d;
        } else {                                    // partout, loin du disque
          x = W * (.06 + Math.random() * .88); y = H * (.06 + Math.random() * .86);
        }
        essai++;
      } while (essai < 40 && ((!pres && Math.hypot(x - g.cx, y - g.cy) < 1.7 * g.R) ||

    var surDisque = Math.hypot(souris.x - d.x, souris.y - d.y) <= d.r;
    if (e.charge >= 1 && surDisque) attendre();
    else if (e.charge > 0){ e.phase = 'annule'; e.tAnnule = performance.now(); e.v0 = e.v; e.dq0 = ss(e.charge, 0, .9); e.c0 = e.charge; }
  }
  /* un trou dans le disque : sur l intro par-dessus, et sur le disque lui-meme
     (il tourne avec lui et reste apres le drop) */
  /* les trous : tires dans le trou noir ; le troisieme en plein centre */
  var imgTrou = new Image();             // charge avec le reste de l intro (nettArmer)
  function trou(k){
    var d = e.d || poser();
    var a = Math.random() * Math.PI * 2, r = k === 2 ? 0 : .3 + Math.random() * .4;
    var x = d.x + d.r * r * Math.cos(a), y = d.y + d.r * r * Math.sin(a);
    var taille = d.r * (k === 2 ? .62 : .5) * (.9 + Math.random() * .2), rot = Math.random() * 360, mir = Math.random() < .5;
    var t2 = document.createElement('span'); t2.className = 'netti-trou';
    t2.style.width = t2.style.height = taille + 'px';
    t2.style.left = (x - taille / 2) + 'px'; t2.style.top = (y - taille / 2) + 'px';
    t2.style.transform = 'rotate(' + rot + 'deg)' + (mir ? ' scaleX(-1)' : '');
    racine.appendChild(t2);
    e.trous.push({ x: x, y: y, s: taille, rot: rot, mir: mir });
  }

  /* l eclatement : au drop, tout l ecran (le monde rouge, le trou noir, sa
     matiere, les trous) se brise en eclats qui tombent, d abord autour du
     trou ; dessous, la page rouge de l album */
  var eclats = null;
  function preparerEclats(t){
    var d = e.d || poser();
    lentille(t, d, 1, 1);                                // une image fraiche dans la toile WebGL
    var W = innerWidth, H = innerHeight;
    var snap = document.createElement('canvas'); snap.width = W; snap.height = H;
    var c2 = snap.getContext('2d');
    c2.fillStyle = '#300'; c2.fillRect(0, 0, W, H);
    if (rouge.readyState >= 2 && rouge.videoWidth){
      var k = Math.max(W / rouge.videoWidth, H / rouge.videoHeight), vw = rouge.videoWidth * k, vh = rouge.videoHeight * k;
      try { c2.drawImage(rouge, (W - vw) / 2, (H - vh) / 2, vw, vh); } catch (x) {}
    }
    try { c2.drawImage(lent, 0, 0, W, H); } catch (x) {}
    e.trous.forEach(function(q){
      c2.save(); c2.translate(q.x, q.y); c2.rotate(q.rot * Math.PI / 180); if (q.mir) c2.scale(-1, 1);
      try { c2.drawImage(imgTrou, -q.s / 2, -q.s / 2, q.s, q.s); } catch (x) {}
      c2.restore();
    });
    /* les eclats : une grille bousculee, chaque case coupee en deux triangles */
    var couche = document.createElement('div'); couche.className = 'netti-eclats';
    couche.style.visibility = 'hidden';
    document.body.appendChild(couche);
    var NX = 9, NY = 6, P = [];
    for (var j = 0; j <= NY; j++){ P.push([]); for (var i = 0; i <= NX; i++){
      var px = i / NX * W, py = j / NY * H;
      if (i > 0 && i < NX) px += (Math.random() - .5) * W / NX * .7;
      if (j > 0 && j < NY) py += (Math.random() - .5) * H / NY * .7;
      P[j].push([px, py]); } }
    var tris = [];
    for (var j = 0; j < NY; j++) for (var i = 0; i < NX; i++){
      var a = P[j][i], b = P[j][i + 1], c = P[j + 1][i + 1], dd = P[j + 1][i];
      if (Math.random() < .5){ tris.push([a, b, c]); tris.push([a, c, dd]); } else { tris.push([a, b, dd]); tris.push([b, c, dd]); }
    }
    var dmax = Math.hypot(W, H), morceaux = [];
    function tailler(pts){
      var mx = Math.floor(Math.min(pts[0][0], pts[1][0], pts[2][0])), my = Math.floor(Math.min(pts[0][1], pts[1][1], pts[2][1]));
      var Mx = Math.ceil(Math.max(pts[0][0], pts[1][0], pts[2][0])), My = Math.ceil(Math.max(pts[0][1], pts[1][1], pts[2][1]));
      if (Mx - mx < 2 || My - my < 2) return;
      var cv = document.createElement('canvas'); cv.width = Mx - mx; cv.height = My - my;
      var cx = cv.getContext('2d'); cx.beginPath();
      pts.forEach(function(p, k){ if (k) cx.lineTo(p[0] - mx, p[1] - my); else cx.moveTo(p[0] - mx, p[1] - my); });
      cx.closePath(); cx.clip(); cx.drawImage(snap, -mx, -my);
      cv.style.left = mx + 'px'; cv.style.top = my + 'px';
      couche.appendChild(cv);
      var gx = (pts[0][0] + pts[1][0] + pts[2][0]) / 3, gy = (pts[0][1] + pts[1][1] + pts[2][1]) / 3;
      var ddx = gx - d.x, ddy = gy - d.y, dist = Math.hypot(ddx, ddy) || 1;
      cv.style.transformOrigin = (gx - mx) + 'px ' + (gy - my) + 'px';
      morceaux.push({ el: cv, x: 0, y: 0, vx: ddx / dist * (40 + Math.random() * 160), vy: ddy / dist * (30 + Math.random() * 90) - 60 - Math.random() * 140,
                      r: 0, vr: (Math.random() - .5) * 4, ret: dist / dmax * .35 + Math.random() * .05 });
    }
    /* la decoupe s etale sur quelques images (pas de saccade au drop) */
    var reste = tris.slice();
    (function etape(){
      reste.splice(0, 28).forEach(tailler);
      if (reste.length) requestAnimationFrame(etape);
    })();
    eclats = { couche: couche, morceaux: morceaux, finir: function(){ reste.splice(0).forEach(tailler); } };
  }
  function eclater(){
    if (!eclats) preparerEclats(performance.now());
    eclats.finir();
    var couche = eclats.couche, morceaux = eclats.morceaux; eclats = null;
    couche.style.visibility = '';
    var t0 = performance.now(), prec = t0;
    (function tomber(tt){
      var dt = Math.min(.04, (tt - prec) / 1000), age = (tt - t0) / 1000; prec = tt;
      morceaux.forEach(function(m){
        if (age < m.ret) return;
        m.vy += 2600 * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.r += m.vr * dt;
        m.el.style.transform = 'translate(' + m.x.toFixed(1) + 'px,' + m.y.toFixed(1) + 'px) rotate(' + m.r.toFixed(3) + 'rad)';
      });
      if (age < 1.6) requestAnimationFrame(tomber); else couche.remove();
    })(t0);
  }
  function coup(tTir){
    e.phase = 'tirs'; e.tCoup = performance.now();
    consigne.classList.remove('on'); racine.classList.remove('pret');
    racine.classList.add('tire');                       // le viseur disparait
    e.r0 = (e.v && e.v.r) || pres(); e.b0 = (e.v && e.v.brume) || 0; e.ouvert = false;
    body.style.setProperty('--netti-disque', 1);
    /* you ready? se tait au premier coup ; sick se charge aussitot, arrete,
       pour partir pile au drop */
    var si = -1; ALB().tracks.forEach(function(tr, j){ if (tr.name === 'sick') si = j; });
    var th1 = document.getElementById('theme'); if (th1){ th1.loop = false; th1.volume = volBase(); }
    if (si >= 0 && window.__playTrack) window.__playTrack(si, false, true);
    if (si >= 0 && window.__dockJump) window.__dockJump(si);
    if (actx && actx.state === 'suspended') actx.resume();
    var t0 = actx ? actx.currentTime + .03 : 0, avant = 30;
    /* venu de l attente : les coups sont deja poses sur la grille du plug */
    if (tTir != null){ avant = Math.max(0, (tTir - actx.currentTime) * 1000); e.tCoup += avant - 30; }
    [0, 1, 2].forEach(function(k){
      if (tTir == null) jouer(k, t0 + k * TEMPS);
      setTimeout(function(){ if (e){ trou(k); if (k === 2) setTimeout(function(){ if (e) preparerEclats(performance.now()); }, 40); } }, avant + k * TEMPS * 1000);
    });
    /* le drop sur le quatrieme temps : sick demarre pour que son premier temps y tombe */
    setTimeout(function(){
      if (!e) return;
      /* le drop : tout se brise et tombe ; la page rouge est la dessous */
      eclater();
      monter();
      if (window.__playNow) window.__playNow();
      finir(); setTimeout(function(){ body.classList.remove('netti-apparition'); }, 1200);
    }, avant + (3 * TEMPS - PREMIER) * 1000);
  }
  /* la page remonte comme apres l atterrissage (deux fois plus vite) ; le
     viseur et le hublot restent par-dessus jusqu au drop */
  function monter(){
    body.classList.add('netti-coupe', 'netti-apparition');
    body.classList.remove('is-stage');
    void body.offsetWidth;
    body.classList.add('netti-revele');
    void body.offsetWidth;
    body.classList.remove('netti-coupe');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ body.classList.add('is-stage'); }); });
  }
  function finir(){
    if (!e) return;
    var auDrop = e.phase === 'tirs';
    e = null;
    plugArreter(auDrop);
    body.classList.remove('netti-on', 'netti-revele');
    Array.prototype.slice.call(racine.querySelectorAll('.netti-trou')).forEach(function(x){ x.remove(); });
    racine.classList.remove('tire');
    body.style.removeProperty('--netti-disque');
    var th2 = document.getElementById('theme'); if (th2) th2.loop = false;
    body.style.translate = '';
    port.style.opacity = anneau.style.opacity = 0;
    racine.classList.remove('charge', 'pret');
    try { rouge.pause(); } catch (x) {}
  }
  window.__nettIntro = function(){
    if (e) return;
    e = { phase: 'vise', charge: 0, appui: false, t: 0, d: null, v: null, trous: [], g: 0 };
    nettArmer();
    preparerChamp();
    preparer();
    /* tant qu on n a pas tire, you ready? tourne en boucle (sinon la piste
       suivante partait sous l intro et les films s arretaient) */
    var th = document.getElementById('theme'); if (th) th.loop = true;
    trousSpin.forEach(function(x){ x.remove(); }); trousSpin = [];
    Array.prototype.slice.call(racine.querySelectorAll('.netti-trou')).forEach(function(x){ x.remove(); });
    body.classList.add('netti-on');
    eclats = null;
    initLentille();
    /* un premier dessin, invisible, pour que la carte graphique soit prete */
    setTimeout(function(){ if (e && e.phase === 'vise' && e.charge === 0){ var d0 = e.d || poser(); lentille(performance.now(), d0, 0, 0); } }, 1200);
    rouge.preload = 'auto'; try { rouge.load(); } catch (x) {}
    peindre({ r: loin(), vu: 0, nuit: 0, brume: 0 });
    setTimeout(function(){ if (e && e.phase === 'vise') consigne.classList.add('on'); }, 2500);
    requestAnimationFrame(boucle);
  };
  window.addEventListener('resize', function(){ if (e) e.d = null; R0 = 0; });
  racine.addEventListener('pointermove', function(ev){ souris.x = ev.clientX; souris.y = ev.clientY; });
  /* pendant l intro, les touches du lecteur (espace : pause) ne jouent pas */
  window.addEventListener('keydown', function(ev){
    if (e && (ev.key === ' ' || ev.code === 'Space')){ ev.preventDefault(); ev.stopImmediatePropagation(); }
  }, true);
  racine.addEventListener('pointerdown', function(ev){
    souris.x = ev.clientX; souris.y = ev.clientY;
    /* le bouton Menu reste utilisable sous l intro */
    var mb = document.getElementById('menuBtn');
    if (mb){ var q = mb.getBoundingClientRect();
      if (ev.clientX >= q.left && ev.clientX <= q.right && ev.clientY >= q.top && ev.clientY <= q.bottom){ mb.click(); return; } }
    if (!e || (e.phase !== 'vise' && e.phase !== 'annule')) return;
    var d = e.d || poser();
    if (actx && actx.state === 'suspended') actx.resume();
    if (Math.hypot(souris.x - d.x, souris.y - d.y) > d.r) return;           // seulement sur le disque
    /* un appui pendant le retour (apres une annulation) etait perdu : on
       reprend la charge la ou le retour en est */
    if (e.phase === 'annule'){
      e.charge = (e.c0 || 0) * (1 - ss((performance.now() - e.tAnnule) / (ANNULE * 1000), 0, 1));
      e.phase = 'vise';
    }
    e.appui = true;
    plugDemarrer();
  });
  window.addEventListener('pointerup', relache);
  window.__nettiArmer = function(){ if (!imgTrou.src) imgTrou.src = 'assets/netti_trou.png'; };
})();

/* Les images de Nettspend qui ne servent qu a lui (le viseur-montre de
   l intro, l etiquette du trou noir, les images d attente de ses films) ne
   partent qu une fois l album regarde : quand body prend alb-nett (le choix
   du disque s arrete sur lui, ou sa page s ouvre). Avant, elles etaient
   dans la page et chargees par tout le monde au depart */
function nettArmer(){
  if (nettArmer.fait) return; nettArmer.fait = true;
  Array.prototype.forEach.call(document.querySelectorAll('[data-nett-src]'), function(el){
    el.src = el.getAttribute('data-nett-src'); el.removeAttribute('data-nett-src');
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-nett-poster]'), function(el){
    el.setAttribute('poster', el.getAttribute('data-nett-poster')); el.removeAttribute('data-nett-poster');
  });
  if (window.__nettiArmer) window.__nettiArmer();
}
(function(){
  if (document.body.classList.contains('alb-nett')){ nettArmer(); return; }
  if (!window.MutationObserver) return nettArmer();
  var obs = new MutationObserver(function(){
    if (document.body.classList.contains('alb-nett')){ obs.disconnect(); nettArmer(); }
  });
  obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
