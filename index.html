   Le seuil est le meme que dans la feuille de style, sinon les deux
   se contrediraient. */

  }

/* ---------------- pistes : defilement libre + loupe facon dock ---------------- */
(function(){
  var STEP   = 206;      // ecart entre deux pistes, mesure le long de l arc
  var RADIUS = 560;      // rayon du manege : plus il est petit, plus ca tourne
  var FADE   = 270;      // debut du fondu, en distance d arc
  var GONE   = 545;      // au dela, la piste a disparu dans le fond
  var SIGMA  = 152;      // largeur de la loupe
  var MAXMAG = .26;      // grossissement maximum sous le curseur
  var SPREAD = 26;       // ecartement des voisines
  var SENS   = .17;      // sensibilite de la molette

  var dock = document.querySelector('.dock');
  var win  = document.querySelector('.dock-win');
  var rail = document.getElementById('dockRail');

  /* La rangee est refaite a chaque changement d album : autant de pastilles
     que de pistes, et le manege se recale sur celle qui ouvre l album. */
  var items = [];
  var N     = 0;
  var TOTAL = 0;

  function build(){
    var a = ALB();
    rail.innerHTML = '';

    items = a.tracks.map(function(t, i){
      var el = document.createElement('div');
      el.className = 'trk';
      el.innerHTML =
        '<button type="button" class="bub' + (a.artFill ? ' is-fill' : '') +
            '" tabindex="-1" aria-label="Track ' + (i+1) + ' - ' + t.name + '">' +
          '<span class="bub-glass"></span>' +
          '<img class="bub-art" src="' + a.art + '" alt="">' +
          '<em class="bub-num">' + (i < 9 ? '0' : '') + (i+1) + '</em>' +
        '</button>' +
        '<span class="trk-name">' + t.name + '</span>';
      rail.appendChild(el);

      el.querySelector('.bub').addEventListener('click', function(){
        if (!window.__playTrack) return;
        window.__playTrack(i);
      });

      return el;
    });

    N     = items.length;
    TOTAL = N * STEP;
    pos   = a.start * STEP;      // la piste qui ouvre l album est au centre
    vel   = 0;
    mark(a.start);
  }

  /* le lisere suit la piste qui joue, d ou qu on l ait demandee */
  function mark(i){
    items.forEach(function(el, j){ el.classList.toggle('is-current', j === i); });
  }

  var pos   = 0;         // decalage courant, en pixels
  var vel   = 0;         // vitesse restante apres le geste
  var hover  = null;     // position visee du curseur dans le cadre, ou null
  var hx     = 0;        // position lissee : la loupe rattrape la souris
  var hAmt   = 0;        // force de la loupe : monte a l entree, retombe a la sortie
  var idle   = 0;

  function wrap(v){
    v = (v + TOTAL / 2) % TOTAL;
    if (v < 0) v += TOTAL;
    return v - TOTAL / 2;
  }

  function render(){
    var half = win.clientWidth / 2;

    for (var i = 0; i < N; i++){
      var arc = wrap(i * STEP - pos);        // distance le long du manege
      var d   = Math.abs(arc);

      /* le ruban est enroule sur un cylindre : les pistes s eloignent en
         tournant vers le fond au lieu de filer tout droit sur les cotes */
      var th = Math.max(-1.35, Math.min(1.35, arc / RADIUS));
      var X  = RADIUS * Math.sin(th);
      var Z  = RADIUS * (Math.cos(th) - 1);
      var Y  = 54 * (1 - Math.cos(th));      // le ruban descend en s eloignant : on suit le cercle
      var rotY = -th * 52;                   // les icones se tournent en partant

      var mag = 0, push = 0;
      if (hAmt > 0.002){
        var dc = (X + half) - hx;
        var g  = Math.exp(-(dc * dc) / (SIGMA * SIGMA)) * hAmt;
        mag  = MAXMAG * g;
        push = SPREAD * (dc / SIGMA) * g;
      }

      var edge = d < FADE ? 1 : Math.max(0, 1 - (d - FADE) / (GONE - FADE));
      var soft = edge * edge * (3 - 2 * edge);

      var el = items[i];
      if (soft <= 0.002){
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        continue;
      }

      var depth = Math.min(1, -Z / (RADIUS * 1.1));      // 0 devant, 1 au fond
      el.style.opacity = (soft * (1 - .78 * depth)).toFixed(3);   // le fond s efface davantage
      el.style.pointerEvents = soft > .1 ? 'auto' : 'none';   // cliquable des qu on la voit, pas seulement au centre
      el.style.filter =
        'brightness(' + (1 - .34 * depth).toFixed(3) + ') ' +
        'blur(' + (depth * 5.2).toFixed(2) + 'px)';
      el.style.transform =
        'translate3d(' + (X + half - 75 + push).toFixed(1) + 'px,' +
                         (Y - mag * 18).toFixed(1) + 'px,' + Z.toFixed(1) + 'px) ' +
        'rotateY(' + rotY.toFixed(2) + 'deg) ' +
        'scale(' + (1 + mag).toFixed(3) + ')';
      el.style.zIndex = String(200 + Math.round(Z) + Math.round(mag * 100));
    }
  }

  function step(){
    /* la loupe se deplace et s allume progressivement : c est ce qui donne
       le moelleux du dock, un saut direct sur la position souris est sec */
    if (hover !== null){
      if (hAmt < 0.002) hx = hover;        // premiere entree : on se cale sans glisser
      hx   += (hover - hx) * 0.12;
      hAmt += (1 - hAmt) * 0.055;   // montee lente : meme la premiere fois, ca ne claque pas
    } else {
      hAmt += (0 - hAmt) * 0.07;
    }

    if (Math.abs(vel) > 0.02){
      pos += vel;
      vel *= 0.945;                          // glisse plus longtemps, s arrete plus doucement
      idle = 0;
    } else {
      vel = 0;
      idle++;
      if (idle > 12){                        // au repos, on se recale doucement sur une piste
        var target = Math.round(pos / STEP) * STEP;
        var diff = target - pos;
        if (Math.abs(diff) > 0.3) pos += diff * 0.075;
        else pos = target;
      }
    }
    // on garde le decalage dans une plage raisonnable : la liste boucle de toute facon
    if (pos >  TOTAL) pos -= TOTAL;
    if (pos < -TOTAL) pos += TOTAL;

    render();
  }

  function frame(){ step(); requestAnimationFrame(frame); }

  win.addEventListener('wheel', function(e){
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    vel += d * SENS;                          // defilement libre, pas cran par cran
    vel = Math.max(-26, Math.min(26, vel));
    idle = 0;
  }, {passive:false});

  win.addEventListener('mousemove', function(e){
    var r = win.getBoundingClientRect();
    var k = r.width / win.clientWidth || 1;      // la scene est mise a l echelle
    hover = (e.clientX - r.left) / k;
  });
  win.addEventListener('mouseleave', function(){ hover = null; });
  window.addEventListener('blur', function(){ hover = null; });

  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') vel += 14;
    if (e.key === 'ArrowLeft')  vel -= 14;
  });

  window.addEventListener('resize', render);

  window.__dockRender = render;
  window.__dockStep = step;
  window.__dockState = function(){ return {pos:pos, vel:vel, hover:hover}; };
  window.__dockPush  = function(d){ vel += d; };

  /* sur telephone la rangee est une simple bande qui glisse au doigt :
     pas de manege en 3D, pas de boucle d animation, rien a calculer */
  /* sur telephone la rangee glisse au doigt : on amene seulement la piste
     ouverte sous les yeux, il n y a pas de manege a animer */
  function reveal(){
    var cur = items[ALB().start];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center', block:'nearest'});
  }

  window.__dockBuild = function(){
    build();
    if (MOBILE) reveal(); else render();
  };
  window.__dockMark = mark;

  build();

  if (MOBILE){ reveal(); return; }

  render();
  requestAnimationFrame(frame);
})();


/* ---------------- paroles synchronisees, facon Apple Music ---------------- */
(function(){

  var audio = document.getElementById('theme');
  var box   = document.getElementById('lyrics');
  var track = document.getElementById('lyrTrack');
  if (!audio || !box) return;

  /* la colonne est reconstruite a chaque changement de piste : une ligne par
     entree chantee, les entrees "music" restent des trous dans lines[] */
  var LYRICS = [];
  var lines  = [];
  var sung   = [];      // indices des lignes chantees, pour le mode reglage

  function buildLines(idx){
    var t = ALB().tracks[idx] || {};
    LYRICS = t.lyrics || [];
    track.innerHTML = '';
    lines = [];
    sung  = [];

    /* le petit rond de musique danse sur le tempo de la piste active */
    var bpm = t.bpm || 100;
    box.style.setProperty('--beat', (60 / bpm).toFixed(3) + 's');

    LYRICS.forEach(function(l, i){
      if (!l.text){ lines[i] = null; return; }

      var el = document.createElement('p');
      el.className = 'lyr';

      /* ce qui est entre parentheses est un choeur : plus petit et plus pale */
      var m = l.text.match(/^(.*?)\s*\((.+)\)\s*$/);
      if (m){
        el.appendChild(document.createTextNode(m[1]));
        var echo = document.createElement('span');
        echo.className = 'lyr-echo';
        echo.textContent = m[2];
        el.appendChild(echo);
      } else {
        el.textContent = l.text;
      }

      el.addEventListener('click', function(){
        target = 0; back = true; box.classList.remove('is-scrubbing');
        audio.currentTime = l.t + 0.02;
      });
      track.appendChild(el);
      lines[i] = el;
      sung.push(i);
    });
  }

  var current = -1;

  function activeAt(time){
    var n = -1;
    for (var i = 0; i < LYRICS.length; i++){ if (time >= LYRICS[i].t) n = i; else break; }
    return n;
  }

  /* la position affichee (pos) chasse en continu la position voulue (want),
     que ce soit le fil de la chanson ou le point pris a la molette : un seul
     ressort, toujours actif, donc jamais de saut brusque d une ligne a l autre,
     meme quand on revient de loin */
  var autoY = 0, pos = 0;

  function place(n){
    var el = lines[n];
    if (!el) return;                       // pendant l instrumental on ne bouge pas la colonne
    autoY = -(el.offsetTop + el.offsetHeight / 2 - box.clientHeight / 2);
  }

  /* La molette fait defiler le texte a la main, bute sur la premiere et la
     derniere ligne pour qu on ne parte jamais dans le vide, puis la chanson
     reprend la main en douceur apres une pause. */
  var target = 0, back = true, backTimer = 0;

  function bounds(){
    var first = null, last = null;
    for (var i = 0; i < lines.length; i++){
      if (!lines[i]) continue;
      if (!first) first = lines[i];
      last = lines[i];
    }
    if (!first) return [0, 0];
    var half = box.clientHeight / 2;
    var top    = half - (first.offsetTop + first.offsetHeight / 2);   // premiere ligne au centre
    var bottom = half - (last.offsetTop  + last.offsetHeight  / 2);   // derniere ligne au centre
    return [bottom, top];
  }

  function wanted(){
    var b = bounds();
    var base = back ? autoY : autoY + target;
    return Math.max(b[0], Math.min(b[1], base));
  }

  (function loop(){
    var w = wanted();
    pos += (w - pos) * 0.14;
    if (Math.abs(w - pos) < .3) pos = w;
    track.style.transform = 'translateY(' + pos.toFixed(1) + 'px)';
    requestAnimationFrame(loop);
  })();

  /* un seul chemin pour la molette et pour le doigt : on pousse le decalage,
     borne aux deux extremites, puis la chanson reprend la main apres la pause */
  function nudge(dy){
    var b = bounds();
    back = false;
    target = Math.max(b[0] - autoY, Math.min(b[1] - autoY, target + dy));
    box.classList.add('is-scrubbing');

    clearTimeout(backTimer);
    backTimer = setTimeout(function(){
      back = true; target = 0;                // la chanson reprend la main, en douceur
      box.classList.remove('is-scrubbing');
    }, 4000);
  }

  box.addEventListener('wheel', function(e){
    e.preventDefault();
    nudge(-e.deltaY * 0.7);
  }, {passive:false});

  /* au doigt : on suit le glissement, un pour un */
  var touchY = null;
  box.addEventListener('touchstart', function(e){
    touchY = e.touches[0].clientY;
  }, {passive:true});

  box.addEventListener('touchmove', function(e){
    if (touchY === null) return;
    var y = e.touches[0].clientY;
    nudge(y - touchY);
    touchY = y;
    e.preventDefault();                       // la page ne doit pas glisser derriere
  }, {passive:false});

  box.addEventListener('touchend', function(){ touchY = null; }, {passive:true});

  function paint(n){
    for (var i = 0; i < lines.length; i++){
      if (!lines[i]) continue;
      lines[i].classList.toggle('is-now',  i === n);
      lines[i].classList.toggle('is-past', i <  n);
    }
  }

  function apply(n){
    var quiet = !!(n < 0 || (LYRICS[n] && LYRICS[n].music));   // sans le double !, toggle bascule au lieu d eteindre
    box.classList.toggle('is-quiet', quiet);   // le texte s enfonce, la note apparait
    if (!quiet){ paint(n); place(n); }
    else paint(n);
  }

  function check(){
    if (!LYRICS.length) return;
    var n = activeAt(audio.currentTime);
    if (n !== current){ current = n; apply(n); }
  }

  function tick(){ check(); requestAnimationFrame(tick); }

  /* appele quand on change de piste depuis le dock : reconstruit la colonne
     avec les paroles de la nouvelle piste (vide si elle n en a pas encore) */
  window.__setLyricsTrack = function(idx){
    buildLines(idx);
    current = -1;
    autoY = 0; pos = 0; target = 0; back = true;
    box.classList.remove('is-scrubbing');
    apply(-1);
  };

  buildLines(ALB().start);   // la piste qui ouvre l album
  apply(-1);
  audio.addEventListener('timeupdate', check);   // filet de securite si les images sont bridees
  audio.addEventListener('seeked', check);
  audio.addEventListener('play', check);
  requestAnimationFrame(tick);

  /* ---- mode reglage : on pose les temps en tapant sur la barre d espace ---- */
  var tuning = false, cursor = 0, stamps = [];

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();

    if (k === 'l'){
      tuning = !tuning; cursor = 0; stamps = [];
      box.classList.toggle('is-tuning', tuning);
      return;
    }
    if (!tuning) return;

    if (e.code === 'Space'){
      e.preventDefault();
      var idx = sung[cursor];
      stamps.push([idx, +audio.currentTime.toFixed(2)]);
      cursor = Math.min(sung.length - 1, cursor + 1);
      current = idx; apply(idx);
    }

    if (k === 'e'){
      var out = stamps.map(function(p){
        return '    { t: ' + p[1].toFixed(2) + ', text: "' + LYRICS[p[0]].text.replace(/"/g, '\\"') + '" }';
      }).join(',' + '\n');
      out = 'var LYRICS = [' + '\n' + out + '\n  ];';
      console.log(out);
      if (navigator.clipboard) navigator.clipboard.writeText(out);
    }
  });

  window.__lyrics = function(){
    return {current: current, quiet: box.classList.contains('is-quiet'), lines: track.children.length};
  };
})();

/* ---------------- choix de l album ---------------- */
(function(){
  /* Changer d album refait toute la page : le disque, la pochette, le decor,
     la rangee des pistes et les paroles. Un seul clic, un seul chemin. */
  var box    = document.getElementById('albums');
  var disc   = document.querySelector('.disc');
  var sleeve = document.querySelector('.sleeve');
  var audio  = document.getElementById('theme');
  if (!box || !disc) return;

  /* on charge les images de l album voisin a l avance : au clic, le disque
     change d un coup au lieu de clignoter en blanc le temps du telechargement */
  ALBUMS.forEach(function(a){
    [a.disc, a.cover].forEach(function(src){ var i = new Image(); i.src = src; });
  });

  var items = ALBUMS.map(function(a, i){
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'alb';
    el.setAttribute('aria-label', a.title + ' - ' + a.by);
    el.innerHTML =
      '<span class="bub">' +
        '<span class="bub-glass"></span>' +
        '<img class="bub-art" src="' + a.thumb + '" alt="">' +
      '</span>' +
      '<span class="alb-name">' + a.title + '</span>';
    el.addEventListener('click', function(){ pick(i); });
    box.appendChild(el);
    return el;
  });

  function pick(i){
    if (i === CUR_ALBUM || !ALBUMS[i]) return;
    CUR_ALBUM = i;
    var a = ALBUMS[i];

    disc.src = a.disc;
    if (sleeve) sleeve.src = a.cover;
    items.forEach(function(el, j){ el.classList.toggle('is-current', j === i); });

    /* le decor de la page suit l album : une seule classe sur le corps,
       la feuille de style s occupe du reste */
    ALBUMS.forEach(function(o){ document.body.classList.remove('alb-' + o.theme); });
    document.body.classList.add('alb-' + a.theme);

    /* la rangee du haut est refaite avec les pistes du nouvel album, puis
       celle qui l ouvre demarre : c est elle qu on veut entendre en arrivant */
    if (window.__dockBuild) window.__dockBuild();
    if (window.__playTrack) window.__playTrack(a.start, true);
  }

  items[0].classList.add('is-current');
  document.body.classList.add('alb-' + ALBUMS[0].theme);
  window.__setAlbum   = pick;
  window.__albumState = function(){
    return {current: CUR_ALBUM, total: ALBUMS.length, track: ALB().start};
  };
})();

/* ---------------- arrivee du disque, impact, puis lecture en boucle ---------------- */
(function(){
  var LAND = 3500;                       // instant ou le disque touche le plateau, ms

  var body  = document.body;
  var fly   = document.getElementById('discFly');
  var deck  = document.querySelector('.deck');
  var audio = document.getElementById('theme');
  var btn   = document.getElementById('sound');
  var vol   = document.getElementById('vol');

  audio.volume = vol.value / 100;
  vol.addEventListener('input', function(){
    audio.volume = vol.value / 100;
    vol.style.setProperty('--v', vol.value + '%');
  });
  vol.style.setProperty('--v', vol.value + '%');

  /* le disque doit venir du centre de l ecran, bien droit : on mesure l ecart
     entre le centre du plateau et le centre de la fenetre, puis on annule la
     rotation de la platine pour que la trajectoire reste verticale a l ecran */
  var platter = document.querySelector('.platter');

  function aim(){
    var r  = platter.getBoundingClientRect();    // repere fixe : le disque, lui, bouge
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var vw = window.innerWidth, vh = window.innerHeight;

    var deg = 0;
    var m = getComputedStyle(deck).transform;
    if (m && m !== 'none'){
      var v = m.slice(m.indexOf('(') + 1, -1).split(',');
      deg = Math.atan2(parseFloat(v[1]), parseFloat(v[0]));
    }
    var c = Math.cos(-deg), s = Math.sin(-deg);

    /* la scene est mise a l echelle : on repasse les ecarts en unites de scene,
       puis on annule la rotation de la platine pour que la trajectoire reste
       droite a l ecran */
    var k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1;

    function put(name, sx, sy){
      var dx = (sx - cx) / k, dy = (sy - cy) / k;
      fly.style.setProperty('--' + name + 'x', (dx * c - dy * s).toFixed(1) + 'px');
      fly.style.setProperty('--' + name + 'y', (dx * s + dy * c).toFixed(1) + 'px');
    }

    put('f', vw * 0.50, vh * 0.50);   // le disque se revele au centre, sous le signe

    aimWave(cx, cy);   // l onde partira de la, c est a dire du disque pose
  }

  /* Centre de l onde et rayon dont elle a besoin pour couvrir l ecran depuis
     ce centre : c est la distance au coin le plus eloigne. Sans ce calcul,
     l onde finirait sa course bien avant la fin de l animation (ou apres). */
  function aimWave(cx, cy){
    var vw = window.innerWidth, vh = window.innerHeight;
    var need = Math.max(
      Math.sqrt(cx * cx + cy * cy),
      Math.sqrt((vw - cx) * (vw - cx) + cy * cy),
      Math.sqrt(cx * cx + (vh - cy) * (vh - cy)),
      Math.sqrt((vw - cx) * (vw - cx) + (vh - cy) * (vh - cy))
    );
    var s = document.body.style;
    s.setProperty('--ox', cx.toFixed(0) + 'px');
    s.setProperty('--oy', cy.toFixed(0) + 'px');
    s.setProperty('--wr', Math.ceil(need) + 'px');
  }
  if (!MOBILE){                    // sans platine, il n y a rien a viser
    aim();
    window.addEventListener('resize', aim);
  }

  /* L arrivee du disque et la musique doivent partir ensemble. Or un navigateur
     refuse le son tant que la page n a recu aucun geste : on teste d abord, sans
     bruit, si le son est autorise. Si oui on lance tout de suite ; sinon on garde
     le disque en l air et on demarre les deux au premier geste. */

  var wanted  = true;
  var started = false;

  function paintBtn(){
    btn.classList.toggle('is-paused', audio.paused);
    btn.classList.toggle('is-waiting', !started || (audio.paused && wanted));
    body.classList.toggle('is-playing', !audio.paused);   // le disque s arrete avec la musique
  }

  function tryPlay(){
    if (!wanted) return;
    var p = audio.play();
    if (p && p.catch) p.catch(function(){});
    setTimeout(paintBtn, 80);
  }

  /* on clique une autre icone du dock : la piste change, la platine continue
     de tourner sans repasser par l intro */
  var trackIdx = ALB().start;

  /* force : on vient de changer d album, la piste demandee doit repartir
     meme si elle porte le meme numero que celle qu on ecoutait avant */
  window.__playTrack = function(idx, force){
    var t = ALB().tracks[idx];
    if (!t || (idx === trackIdx && !force)) return;
    trackIdx = idx;

    var wasPlaying = started && !audio.paused;
    audio.pause();
    audio.src = t.audio;
    audio.currentTime = 0;

    if (window.__setLyricsTrack) window.__setLyricsTrack(idx);
    if (window.__dockMark) window.__dockMark(idx);

    if (wasPlaying || force){ wanted = true; tryPlay(); }
    paintBtn();
  };

  function startIntro(){
    if (started) return;
    started = true;
    body.classList.add('is-armed');          // le disque part du centre de l ecran

    /* sur telephone il n y a pas de platine : le signe s efface, tout arrive
       d un coup et la musique part tout de suite */
    if (MOBILE){
      body.classList.add('is-lighten');
      body.classList.add('is-stage');
      body.classList.add('is-landed');
      tryPlay();
      paintBtn();
      return;
    }

    /* le fond et la platine se levent ensemble, dans la meme respiration :
       ainsi tout est deja en place quand le disque se pose, et l atterrissage
       reste le seul temps fort, pas un troisieme sursaut separe */
    /* Tout se joue au contact : le fond reste noir jusque la, puis l onde
       claire part du disque et la scene nait avec elle.
       On ne declenche PAS sur un minuteur : si le navigateur prend du retard,
       le disque n a pas fini de tomber et l onde partirait a cote de lui. On
       attend la fin reelle du vol ; le minuteur ne sert que de filet. */
    var landed = false;

    function land(){
      if (landed) return;
      landed = true;

      /* Le centre de l onde est celui du disque lui meme, releve maintenant.
         Comme on arrive ici a la fin de son vol, il est sur le plateau ; et si
         le navigateur avait pris du retard, l onde partirait quand meme de la
         ou le disque se trouve vraiment, jamais a cote de lui. */
      if (fly){
        var r = fly.getBoundingClientRect();
        aimWave(r.left + r.width / 2, r.top + r.height / 2);
      }

      body.classList.add('is-landed');       // il se pose : le plateau tourne, le bras descend
      body.classList.add('is-open');         // l onde claire s ouvre depuis le point d impact
      body.classList.add('is-stage');        // la platine et le reste naissent avec l onde
      body.classList.add('is-hit');
      setTimeout(function(){ body.classList.remove('is-hit'); }, 240);
      tryPlay();                             // et la musique demarre au meme instant
      paintBtn();

      /* l onde a fini sa course : on retire les nappes pour rendre au fond
         ses teintes pastel */
      setTimeout(function(){ body.classList.add('is-lit'); }, 1000);
    }

    if (REDUCED){
      setTimeout(land, LAND);                // sans vol, il n y a rien a attendre
    } else {
      fly.addEventListener('animationend', function(e){
        if (e.animationName === 'flyin') land();
      });
      setTimeout(land, LAND + 700);          // filet, si l evenement ne vient pas
    }
  }

  function waitForGesture(){
    var evts = ['pointerdown','keydown','wheel','touchstart'];
    function go(){
      evts.forEach(function(e){ window.removeEventListener(e, go); });
      startIntro();
    }
    evts.forEach(function(e){ window.addEventListener(e, go, {passive:true}); });
  }

  waitForGesture();
  window.__startIntro = startIntro;

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if (!started){ startIntro(); paintBtn(); return; }
    if (audio.paused){ wanted = true; tryPlay(); }
    else { wanted = false; audio.pause(); }
    paintBtn();
  });

  audio.addEventListener('play', paintBtn);
  audio.addEventListener('pause', paintBtn);
  paintBtn();
})();
</script>

</body>
</html>
