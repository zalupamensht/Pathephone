<!-- Le choix du disque : la premiere chose qu on voit (ordinateur). On
     regarde un disque, il file dans sa pochette et le monde de l album
     s ouvre ; un clic, et il plonge : l ecran d accueil de l album suit.
     Tout est rempli par le script (module du choix, a la fin). -->
<div class="picker" id="picker" data-alb="0" role="region" aria-label="Choose an album">
  <div class="pk-glow"></div>
  <div class="pk-world" aria-hidden="true">
    <div class="pk-bg" id="pkBgA"></div>
    <div class="pk-bg" id="pkBgB"></div>
    <div class="pk-shade"></div>
  </div>
  <!-- l album : la pochette, et le disque a moitie sorti d elle -->
  <div class="pk-album" id="pkAlbum">
    <!-- les albums voisins, qui depassent en haut et en bas -->
    <button class="pk-peek pk-up" id="pkUp" type="button" aria-label="Album au dessus"><img id="pkUpImg" alt="" draggable="false"></button>
    <button class="pk-peek pk-down" id="pkDown" type="button" aria-label="Album au dessous"><img id="pkDownImg" alt="" draggable="false"></button>
    <img class="pk-sleeve" id="pkSleeve" alt="" draggable="false">
      <button class="pk-hit" id="pkHit" type="button" aria-label="Open this album">
      <span class="pk-sink"><img class="pk-disc" id="pkDisc" alt="" draggable="false"></span>
    </button>
  </div>
  <div class="pk-info" id="pkInfo"></div>
  <!-- la bande du bas : une vignette par image ou film du fond -->
  <div class="pk-strip" id="pkStrip"></div>
  <button class="pk-arrow pk-u" id="pkPrev" type="button" aria-label="Previous album">
    <svg viewBox="0 0 22 11" aria-hidden="true"><path d="M1 10 L11 1.5 L21 10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
  <button class="pk-arrow pk-d" id="pkNext" type="button" aria-label="Next album">
    <svg viewBox="0 0 22 11" aria-hidden="true"><path d="M1 1 L11 9.5 L21 1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
  <!-- les trois barres : elles disent ou l on est, et ouvrent la liste -->
  <button class="pk-menu" id="pkMenu" type="button" aria-label="Tous les albums" aria-expanded="false"></button>
  <div class="pk-list" id="pkList" hidden></div>
  <!-- le volume, discret dans un coin : il regle aussi celui du site -->

    <button class="pk-mute" id="pkMute" type="button" aria-label="Sound off" aria-pressed="false">

    </button>

<script>
/* pistes qui ont un fichier audio : cliquer sur une autre icone du dock change
   de piste ; les autres numeros du menage restent muets pour le moment */
/* le ?v= force le navigateur a relire le fichier : sans lui il ressert
   l ancienne version gardee en cache, et on entend la mauvaise piste */
var AV = '?v=3';                  // les pistes allegees : a changer quand un mp3 change
var TRACK_AUDIO = {
  0: 'assets/track0.mp3' + AV,  1: 'assets/track1.mp3' + AV,  2: 'assets/track2.mp3' + AV,
  3: 'assets/track3.mp3' + AV,  4: 'assets/track4.mp3' + AV,  5: 'assets/track5.mp3' + AV,
  6: 'assets/track6.mp3' + AV,  7: 'assets/track7.mp3' + AV,  8: 'assets/track8.mp3' + AV,

/* l album ouvert : une seule variable, lue partout, jamais recopiee */
var CUR_ALBUM = 0;
function ALB(){ return ALBUMS[CUR_ALBUM]; }

/* Les images prises d avance restent tenues ici. Une new Image() lachee
   aussitot partait au ramasse-miettes, et l image avec elle : au moment de
   la montrer, le navigateur redemandait le fichier au serveur (un aller et
   retour a chaque changement d album, des secondes quand le cache du serveur
   est froid, ou si l horloge de l ordinateur est decalee et que tout le
   cache parait perime). Tenue ici, elle est reprise telle quelle, sans
   reseau. imagePrete : une promesse qui tient quand l image est decodee. */
var IMAGES = {};
function garderImage(src){
  if (!src) return null;
  var im = IMAGES[src];
  if (!im){ im = new Image(); im.decoding = 'async'; im.src = src; IMAGES[src] = im; }
  return im;
}
function imagePrete(src){
  var im = garderImage(src);
  if (!im) return Promise.resolve();
  if (im.complete && im.naturalWidth) return im.decode ? im.decode().catch(function(){}) : Promise.resolve();
  return new Promise(function(ok){
    im.addEventListener('load', function(){ (im.decode ? im.decode() : Promise.resolve()).catch(function(){}).then(ok); }, {once: true});
    im.addEventListener('error', function(){ ok(); }, {once: true});
  });
}
/* attend que tout soit pret, mais jamais plus de max ms */
function quandPret(promesses, max, fn){
  var fait = false;
  function go(){ if (!fait){ fait = true; fn(); } }
  Promise.all(promesses).then(go, go);
  setTimeout(go, max);
}


/* Version telephone : meme fonctions, mise en page simple et legere.
   Le seuil est le meme que dans la feuille de style, sinon les deux
   se contrediraient. */
/* une image ne se traine pas hors de la page (Firefox ignore la feuille de
   style pour cela) */
document.addEventListener('dragstart', function(e){ e.preventDefault(); });

var MOBILE = window.matchMedia('(max-width: 820px)').matches;
if (MOBILE) document.body.classList.add('is-mobile');

/* La page s ouvre sur le choix du disque (ordinateur seulement pour
   l instant) : tant qu il est la, rien de l ecran d accueil ne part — ni
   l ambiance, ni le signe. Le module du choix est a la fin du script. */
var PICKER = !MOBILE;
if (PICKER) document.body.classList.add('is-picking');

/* le systeme demande de limiter les animations : le vol du disque est alors
   remplace par un simple fondu, donc rien a attendre avant la pose */
var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- toute la scene tient dans la fenetre ---------------- */
(function(){
  if (MOBILE) return;              // sur telephone la page coule toute seule

  var W = 1440, H = 900;
  var fit  = document.getElementById('fit');
  var box  = document.getElementById('stageBox');

  function apply(){
    var k = Math.min(1, (window.innerHeight - 28) / H, (window.innerWidth - 28) / W);
    k = Math.max(.4, k);
    box.style.transform = 'scale(' + k + ')';
    fit.style.height = (H * k) + 'px';
    fit.style.width  = (W * k) + 'px';
    /* la scene reste a sa taille, au milieu. Les marges qu elle laisse (en
       pixels de la scene) : les pistes du haut et Menu en reprennent la
       moitie, pour ne pas descendre vers la platine sur un ecran plus haut */
    box.style.setProperty('--haut', ((window.innerHeight - H * k) / 2 / k) + 'px');
    box.style.setProperty('--cote', ((window.innerWidth - W * k) / 2 / k) + 'px');
    document.documentElement.style.setProperty('--fit', k);
  }

  apply();
  window.addEventListener('resize', apply);
})();

/* ---------------- pistes : defilement libre + loupe facon dock ---------------- */
(function(){
  var STEP   = 206;      // ecart entre deux pistes, mesure le long de l arc
  var RADIUS = 560;      // rayon du manege : plus il est petit, plus ca tourne
  var FADE   = 270;      // debut du fondu, en distance d arc
  var GONE   = 545;      // au dela, la piste a disparu dans le fond
  var SIGMA  = 152;      // largeur de la loupe
  var MAXMAG = .26;      // grossissement maximum sous le curseur
  var SPREAD = 26;       // ecartement des voisines
  var SENS   = .17;      // sensibilite de la molette
  var DOUX   = .13;      // approche d une piste qu on vient poser au centre
  var VMAX   = 24;       // vitesse bornee de cette approche, en px par image
  var DOUX_CLIC = .085;  // la piste cliquee vient au centre plus posement...
  var VMAX_CLIC = 15;    // ...surtout depuis le bord, ou le trajet est long
  var ARRET  = 40;       // le curseur doit rester ce temps sur une piste pour qu elle sonne, ms
                         // (la loupe fait parfois trembler la limite entre deux pastilles)
  var BOUGE_MIN = 14;    // deplacement de souris qui compte pour un nouveau geste, px

  var body = document.body;
  var dock = document.querySelector('.dock');
  var win  = document.querySelector('.dock-win');
  var rail = document.getElementById('dockRail');

  /* La rangee est refaite a chaque changement d album : autant de pastilles
     que de pistes, et le manege se recale sur celle qui ouvre l album. */
  var items = [];
  var N     = 0;
  var TOTAL = 0;

  function build(){
    var a = ALB();
    rail.innerHTML = '';

    items = a.tracks.map(function(t, i){
      var el = document.createElement('div');
      el.className = 'trk';
      el.dataset.i = i;
      el.innerHTML =
        '<button type="button" class="bub' + (a.artFill ? ' is-fill' : '') +
            '" tabindex="-1" aria-label="Track ' + (i+1) + ' - ' + t.name + '">' +
          '<span class="bub-glass"></span>' +
          '<img class="bub-art" src="' + a.art + '" alt="">' +
          '<em class="bub-num">' + (i < 9 ? '0' : '') + (i+1) + '</em>' +
        '</button>' +
        '<span class="trk-name">' + t.name +
          (t.feat ? '<em class="trk-feat">' + t.feat + '</em>' : '') +
        '</span>';
      rail.appendChild(el);

      var bub = el.querySelector('.bub');
      /* un clic de souris ne donne pas le clavier a la pastille : sinon la
         barre d espace, au lieu de mettre en pause, re-cliquerait la piste */
      bub.addEventListener('mousedown', function(e){ e.preventDefault(); });
      bub.addEventListener('click', function(){
        if (!scenePrete()) return;       // la rangee est la mais encore invisible
        var j = choisie(i);
        designer(j);
        var son = window.__ui ? window.__ui('select') : 0;
        if (window.__pickTrack) window.__pickTrack(j, son);
      });

      return el;
    });

    N     = items.length;
    TOTAL = N * STEP;
    pos   = a.start * STEP;      // la piste qui ouvre l album est au centre
    vel   = 0;
    centre = a.start;            // la reconstruction ne fait pas de bruit
    cible = null; parSurvol = false;
    visee = -1; candidat = -1; survolee = -1;
    mark(a.start);
  }

  /* le lisere suit la piste qui joue, d ou qu on l ait demandee */
  function mark(i){
    items.forEach(function(el, j){ el.classList.toggle('is-current', j === i); });
  }

  var pos   = 0;         // decalage courant, en pixels
  var vel   = 0;         // vitesse restante apres le geste
  var hover  = null;     // position visee du curseur dans le cadre, ou null
  var hx     = 0;        // position lissee : la loupe rattrape la souris
  var hAmt   = 0;        // force de la loupe : monte a l entree, retombe a la sortie
  var idle   = 0;
  var vuPos = NaN, vuHx = NaN, vuAmt = NaN, vuHalf = NaN;   // dernier etat dessine
  var centre = -1;       // la piste au centre, pour le tic de passage
  var roule  = -1e9;     // dernier instant ou le manege a bouge
  var cible  = null;     // position ou le manege va se poser (fleches, clic), ou null
  var parSurvol = false; // ce trajet vient d un clic : pas de tic de passage en route
  var visee  = -1;       // la piste qu on vient de cliquer, en route vers le centre
  var survolee = -1;     // la derniere piste qui a sonne au survol
  var candidat = -1;     // la piste sous le curseur...
  var depuis = 0;        // ...et depuis quand
  var mx = 0, my = 0;    // le curseur, en coordonnees de la fenetre
  var ancreX = -1e9, ancreY = -1e9;   // le curseur au dernier geste pris en compte

  function wrap(v){
    v = (v + TOTAL / 2) % TOTAL;
    if (v < 0) v += TOTAL;
    return v - TOTAL / 2;
  }

  function render(){
    var half = win.clientWidth / 2;

    for (var i = 0; i < N; i++){
      var arc = wrap(i * STEP - pos);        // distance le long du manege
      var d   = Math.abs(arc);

      /* le ruban est enroule sur un cylindre : les pistes s eloignent en
         tournant vers le fond au lieu de filer tout droit sur les cotes */
      var th = Math.max(-1.35, Math.min(1.35, arc / RADIUS));
      var X  = RADIUS * Math.sin(th);
      var Z  = RADIUS * (Math.cos(th) - 1);
      var Y  = 54 * (1 - Math.cos(th));      // le ruban descend en s eloignant : on suit le cercle
      var rotY = -th * 52;                   // les icones se tournent en partant

      var mag = 0, push = 0;
      if (hAmt > 0.002){
        var dc = (X + half) - hx;
        var g  = Math.exp(-(dc * dc) / (SIGMA * SIGMA)) * hAmt;
        mag  = MAXMAG * g;
        push = SPREAD * (dc / SIGMA) * g;
      }

      var edge = d < FADE ? 1 : Math.max(0, 1 - (d - FADE) / (GONE - FADE));
      var soft = edge * edge * (3 - 2 * edge);

      var el = items[i];
      if (soft <= 0.002){
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        continue;
      }

      var depth = Math.min(1, -Z / (RADIUS * 1.1));      // 0 devant, 1 au fond
      el.style.opacity = (soft * (1 - .78 * depth)).toFixed(3);   // le fond s efface davantage
      el.style.pointerEvents = soft > .1 ? 'auto' : 'none';   // cliquable des qu on la voit, pas seulement au centre
      /* devant, aucun filtre : un filtre, meme nul, empeche Chrome de flouter
         ce qu il y a derriere une pastille de verre (Nettspend) */
      el.style.filter = depth < .005 ? '' :
        'brightness(' + (1 - .34 * depth).toFixed(3) + ') ' +
        'blur(' + (depth * 5.2).toFixed(2) + 'px)';
      el.style.transform =
        'translate3d(' + (X + half - 75 + push).toFixed(1) + 'px,' +
                         (Y - mag * 18).toFixed(1) + 'px,' + Z.toFixed(1) + 'px) ' +
        'rotateY(' + rotY.toFixed(2) + 'deg) ' +
        'scale(' + (1 + mag).toFixed(3) + ')';
      el.style.zIndex = String(200 + Math.round(Z) + Math.round(mag * 100));
    }
  }

  function step(){
    /* la loupe se deplace et s allume progressivement : c est ce qui donne
       le moelleux du dock, un saut direct sur la position souris est sec */
    if (hover !== null){
      if (hAmt < 0.002) hx = hover;        // premiere entree : on se cale sans glisser
      hx   += (hover - hx) * 0.12;
      hAmt += (1 - hAmt) * 0.055;   // montee lente : meme la premiere fois, ca ne claque pas
      if (hAmt > .9995) hAmt = 1;
      if (Math.abs(hover - hx) < .02) hx = hover;
    } else {
      hAmt += (0 - hAmt) * 0.07;
      if (hAmt < .002) hAmt = 0;    // le rendu la tient deja pour nulle sous ce seuil
    }

    var avant = pos;
    if (cible !== null){
      /* une piste vient se poser au centre : approche douce, a vitesse bornee.
         Des appuis rapproches se parcourent a allure reguliere, ils ne
         s additionnent pas en elan comme la molette. */
      var reste = cible - pos;
      var vmax  = parSurvol ? VMAX_CLIC : VMAX;
      var doux  = parSurvol ? DOUX_CLIC : DOUX;
      if (Math.abs(reste) < 0.3){ pos = cible; cible = null; parSurvol = false; }
      else pos += Math.max(-vmax, Math.min(vmax, reste * doux));
      vel = 0;
      idle = 0;
    } else if (Math.abs(vel) > 0.02){
      pos += vel;
      vel *= 0.945;                          // glisse plus longtemps, s arrete plus doucement
      idle = 0;
    } else {
      vel = 0;
      idle++;
      if (idle > 12){                        // au repos, on se recale doucement sur une piste
        var target = Math.round(pos / STEP) * STEP;
        var diff = target - pos;
        if (Math.abs(diff) > 0.3) pos += diff * 0.075;
        else pos = target;
      }
    }
    // on garde le decalage dans une plage raisonnable : la liste boucle de toute facon
    if (pos >  TOTAL){ pos -= TOTAL; if (cible !== null) cible -= TOTAL; }
    if (pos < -TOTAL){ pos += TOTAL; if (cible !== null) cible += TOTAL; }
    if (Math.abs(pos - avant) > 0.05) roule = performance.now();

    /* une piste passe au centre : petit tic, comme d une case a l autre.
       Pas quand c est un clic qui amene sa piste : le son de choix sonne deja. */
    var c = ((Math.round(pos / STEP) % N) + N) % N;
    if (c !== centre){
      centre = c;
      if (window.__ui && !parSurvol) window.__ui('scroll');
    }

    /* on ne reecrit les styles des pastilles que si quelque chose a bouge :
       au repos, rien a recalculer, image apres image */
    var half = win.clientWidth / 2;
    if (pos !== vuPos || hx !== vuHx || hAmt !== vuAmt || half !== vuHalf){
      vuPos = pos; vuHx = hx; vuAmt = hAmt; vuHalf = half;
      render();
    }
    survol();
  }

  /* Le survol ne deplace rien : la loupe grossit la piste, et elle sonne une
     fois. On ne suit que la main : il faut que le curseur ait vraiment bouge
     depuis le dernier geste. Sans cela, la voisine qui glisse sous un curseur
     immobile (molette, fleches, piste cliquee qui file au centre) sonnerait
     aussi, par dessus le tic de passage ou le son de choix. */
  function survol(){
    if (hover === null || !scenePrete()){ candidat = -1; return; }
    var now = performance.now();
    if (cible !== null || Math.abs(vel) > 0.02 || now - roule < 120) return;
    if (Math.abs(mx - ancreX) + Math.abs(my - ancreY) < BOUGE_MIN){ candidat = -1; return; }

    var el  = document.elementFromPoint(mx, my);
    var trk = el && el.closest ? el.closest('.trk') : null;
    var j   = trk ? items.indexOf(trk) : -1;
    if (j < 0 || j === survolee){ candidat = -1; return; }
    if (j !== candidat){ candidat = j; depuis = now; return; }
    if (now - depuis < ARRET) return;

    candidat = -1;
    ancreX = mx; ancreY = my;
    survolee = j;
    if (window.__ui) window.__ui('hover');            // un son par piste survolee
  }

  /* la rangee existe des le chargement, invisible : elle ne reagit qu une
     fois la page apparue, et pas pendant un film d ouverture */
  function scenePrete(){
    return body.classList.contains('is-stage') && !body.classList.contains('is-intro');
  }

  /* un clic amene sa piste au centre, en glissant doucement, sans son de
     survol ni tic de passage (le son de choix sonne deja) ; le survol attend
     ensuite que la souris reparte */
  function designer(j){
    visee = j; candidat = -1; survolee = j;
    ancreX = mx; ancreY = my;
    var d = wrap(j * STEP - pos);
    if (Math.abs(d) > 0.3){ vel = 0; cible = pos + d; parSurvol = true; }
  }

  /* la piste qu on clique : celle qu on vient de cliquer, meme si le manege,
     en l amenant au centre, a fait glisser une voisine sous le curseur. Des
     que la souris a bouge, c est de nouveau la piste sous le curseur. */
  function choisie(i){
    /* la piste sous le curseur, celle que la loupe montre : apres un glissement
       vers le centre, c est la voisine arrivee sous la souris qu on veut */
    return i;
  }

  /* un geste qui fait tourner le manege (molette, fleches) reprend la main :
     plus de piste designee, et le survol attend que la souris bouge */
  function reprendre(){
    cible = null; parSurvol = false;
    visee = -1; candidat = -1;
    ancreX = mx; ancreY = my;
  }

  function frame(){ step(); requestAnimationFrame(frame); }

  win.addEventListener('wheel', function(e){
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    reprendre();
    vel += d * SENS;                          // defilement libre, pas cran par cran
    vel = Math.max(-26, Math.min(26, vel));
    idle = 0;
  }, {passive:false});

  win.addEventListener('mousemove', function(e){
    var r = win.getBoundingClientRect();
    var k = r.width / win.clientWidth || 1;      // la scene est mise a l echelle
    hover = (e.clientX - r.left) / k;
  });
  window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, {passive:true});
  /* en revenant dans le cadre, la souris a forcement bouge : le survol repart */
  win.addEventListener('mouseleave', function(){ hover = null; candidat = -1; survolee = -1; ancreX = ancreY = -1e9; });
  window.addEventListener('blur', function(){ hover = null; });

  /* Fleches : exactement une piste par appui. On vise la piste suivante au
     lieu d ajouter de l elan : trois appuis rapides font trois pistes, pas une
     glissade qui en saute. Touche maintenue : jamais plus de deux pistes
     d avance.
     Les fleches ne servent qu a cela : le navigateur ne fait plus rien
     d autre avec (ni defiler, ni deplacer une selection, ni regler le
     volume). Entree lance la piste amenee au centre, comme un clic ; la
     barre d espace reste la lecture et la pause. */
  function saisie(t){
    var tag = t && t.tagName;
    if (t && t.isContentEditable) return true;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    return tag === 'INPUT' && !/^(range|checkbox|radio|button|submit)$/i.test(t.type || '');
  }
  function auCentre(){
    var p = cible !== null ? cible : pos;
    return ((Math.round(p / STEP) % N) + N) % N;
  }
  window.addEventListener('keydown', function(e){
    if (MOBILE || saisie(e.target)) return;
    var fleche = e.key === 'ArrowRight' || e.key === 'ArrowLeft';
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); return; }
    if (e.key === 'Enter'){
      if (!scenePrete() || !N) return;
      e.preventDefault();                    // un bouton qui a le clavier ne se clique pas en plus
      if (e.repeat) return;
      var j = auCentre();
      designer(j);
      var son = window.__ui ? window.__ui('select') : 0;
      if (window.__pickTrack) window.__pickTrack(j, son);
      return;
    }
    if (!fleche) return;
    e.preventDefault();
    if (!scenePrete()) return;
    var dir  = e.key === 'ArrowRight' ? 1 : -1;
    var base = cible !== null ? cible : Math.round(pos / STEP) * STEP;
    var but  = base + dir * STEP;
    if (Math.abs(but - pos) > 2 * STEP + 1) return;
    reprendre();
    vel = 0;
    cible = but;
  });

  window.addEventListener('resize', render);

  window.__dockRender = render;
  window.__dockStep = step;
  window.__dockState = function(){ return {pos:pos, vel:vel, hover:hover}; };
  window.__dockPush  = function(d){ reprendre(); vel += d; };

  /* sur telephone la rangee est une simple bande qui glisse au doigt :
     pas de manege en 3D, pas de boucle d animation, rien a calculer */
  /* sur telephone la rangee glisse au doigt : on amene seulement la piste
     ouverte sous les yeux, il n y a pas de manege a animer */
  function reveal(){
    var cur = items[ALB().start];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center', block:'nearest'});
  }

  window.__dockBuild = function(){
    build();
    if (MOBILE) reveal(); else render();
  };
  /* la piste qui joue vient se poser au centre, meme quand elle change seule
     (fin de piste, piste suivante) : meme glissement pose qu apres un clic,
     sans tic de passage. Si la main fait tourner le manege a ce moment, on
     ne le lui arrache pas. */
  window.__dockJump = function(i){
    mark(i);
    if (MOBILE || !N) return;
    vel = 0; cible = null; parSurvol = false; pos = i * STEP;
    render();
  };
  window.__dockMark = function(i){
    mark(i);
    if (MOBILE){
      var el = items[i];
      if (el && el.scrollIntoView) el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
      return;
    }
    if (!N || !scenePrete() || Math.abs(vel) > .5) return;
    var d = wrap(i * STEP - pos);
    if (Math.abs(d) > .3){ vel = 0; cible = pos + d; parSurvol = true; }
  };

  build();

  if (MOBILE){ reveal(); return; }

  render();
  requestAnimationFrame(frame);
})();


/* ---------------- les sons d interface, facon XMB ---------------- */
/* Petits sons de navigation, faits pour le site. Ils ne jouent que musique
   arretee : pendant l ecoute, l interface se tait et laisse la place au
   morceau. Ils passent par Web Audio : latence nulle, et plusieurs tics
   peuvent se chevaucher quand on fait defiler vite. */
(function(){
  var SONS = {
    scroll:     'assets/ui_scroll.mp3?v=2',        // une piste passe au centre du manege
    hover:      'assets/ui_hover.mp3?v=2',         // la souris passe sur une pastille
    select:     'assets/ui_album.mp3?v=2',         // on choisit une piste (le meme son que pour un album)
    album:      'assets/ui_album.mp3?v=2',         // on change d album
    albumHover: 'assets/ui_album_hover.mp3'        // la souris passe sur un album
  };
  /* ecart minimal entre deux memes sons, en ms : un coup de molette rapide
     fait passer plusieurs pistes par image, on n en garde qu un tic net */
  var ECART = { scroll: 45, hover: 70, select: 150, album: 150, albumHover: 70 };

  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !window.fetch) return;

  var music = document.getElementById('theme');
  var ctx = null, sortie = null;
  var octets = {}, tampons = {}, dernier = {}, finit = {};

  /* l instant ou le son s est tu, en secondes : la ou il passe sous -30 dB
     de sa crete. Au dela il ne reste qu une traine qu on n entend plus sous
     la musique. Mesure sur le son lui meme : un autre fichier, une autre
     duree, sans rien regler a la main. */
  function tu(t){
    var d = t.getChannelData(0), crete = 0, i;
    for (i = 0; i < d.length; i++) if (Math.abs(d[i]) > crete) crete = Math.abs(d[i]);
    var seuil = crete * .0316;
    for (i = d.length - 1; i > 0 && Math.abs(d[i]) < seuil; i--);
    return i / t.sampleRate;
  }

  /* les fichiers sont recuperes tout de suite, decodes des que le son
     est permis : le premier clic a deja de quoi sonner */
  Object.keys(SONS).forEach(function(nom){
    octets[nom] = fetch(SONS[nom])
      .then(function(r){ return r.ok ? r.arrayBuffer() : null; })
      .catch(function(){ return null; });
  });

  function decoder(nom){
    octets[nom].then(function(b){
      if (!b) return;
      ctx.decodeAudioData(b, function(t){ tampons[nom] = t; finit[nom] = tu(t); }, function(){});
    });
  }

  /* un navigateur n ouvre le son qu apres un geste */
  function eveiller(){
    if (!ctx){
      try { ctx = new AC(); } catch (e) { return; }
      sortie = ctx.createGain();
      sortie.connect(ctx.destination);
      Object.keys(SONS).forEach(decoder);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  ['pointerdown', 'keydown', 'touchend'].forEach(function(e){
    window.addEventListener(e, eveiller, {passive: true, capture: true});
  });

  /* rend le temps, en secondes, au bout duquel le son s est tu ; 0 s il
     n a pas sonne */
  /* partout : le son joue meme hors pause (la page du choix du disque, ou
     la musique n a pas encore commence). Au tout premier geste le tampon
     n est pas encore decode : un simple lecteur prend alors le relais. */
  window.__ui = function(nom, partout){
    if (partout && SONS[nom] && (!ctx || !tampons[nom])){
      try {
        var l = new Audio(SONS[nom]);
        l.volume = music && !music.muted ? music.volume : 0;
        l.play().catch(function(){});
      } catch (e) {}
      return 0;
    }
    if (!ctx || !tampons[nom]) return 0;
    if (!partout && (!window.__musicPaused || !window.__musicPaused())) return 0;
    var now = performance.now();
    /* le meme son vient de partir : il ne repart pas, mais on rend le temps
       qu il lui reste, pour qu une piste ne demarre pas par dessus lui */
    if (now - (dernier[nom] || -1e9) < ECART[nom]){
      var reste = (finit[nom] || 0) - (now - dernier[nom]) / 1000;
      return reste > 0 ? reste : 0;
    }
    dernier[nom] = now;
    /* le curseur de volume du site regle aussi l interface */
    sortie.gain.value = music && !music.muted ? music.volume : 0;
    var s = ctx.createBufferSource();
    s.buffer = tampons[nom];
    s.connect(sortie);
    s.start();
    return finit[nom] || 0;
  };
})();


/* ---------------- la tempete de neige d Unmusique ---------------- */
/* La neige est poussee par un vent qui ne faiblit pas tant que la musique
   joue, et dont tout depend du tempo de la piste : la vitesse de chute et la
   force du vent suivent le BPM, et chaque temps, cale sur la position reelle
   dans le morceau, donne une petite poussee. Musique arretee, la tempete
   retombe en neige calme, comme le disque s arrete avec elle. Tout change
   en douceur : une nouvelle piste ne fait pas sauter la neige.
   Les flocons ont trois epaisseurs de profondeur : loin, petits, lents et
   pales ; pres, gros, flous, rapides, un peu etires par le vent. */
(function(){
  var cv = document.getElementById('blizzard');
  if (!cv || !cv.getContext || REDUCED) return;
  var g = cv.getContext('2d');
  var body = document.body;

  var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  /* discrete : la tempete se lit au mouvement (vent, rafales, obliques),
     pas a la quantite ni a la taille des flocons */
  var DENSITE = 420;          // flocons pour un ecran de 1440 x 900
  var MAX = MOBILE ? 160 : 700;

  var CHUTE  = 42;            // chute d un flocon lointain a 100 BPM, px/s
  var CHUTE_PRES = 150;       // en plus pour un flocon tout proche
  var VENT   = 70;            // vent de fond a 100 BPM, px/s
  var RAFALE = 300;           // vent de tempete en plus a 100 BPM, px/s...
  var SOUFFLE = .55;          // ...dont il souffle en permanence cette part
  var CALME  = .3;            // part de la tempete qui reste musique arretee

  /* le flocon : un seul ton gris neutre qui se fond vers le bord, comme la
     neige vue contre un ciel clair. Sur le papier presque blanc il se lit en
     gris doux, sur la platine noire en clair. Un seul ton et une opacite qui
     ne fait que decroitre : aucun anneau ni contour possible (l ancien coeur
     bleu cerne de blanc faisait un liseré sur le noir). Le blanc pur, lui,
     disparaissait sur le papier. */
  function sprite(dur){
    var s = document.createElement('canvas'); s.width = s.height = 64;
    var c = s.getContext('2d');
    var gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0,          'rgba(176,180,187,.95)');
    gr.addColorStop(dur ? .35 : .22, 'rgba(176,180,187,.64)');
    gr.addColorStop(dur ? .7 : .6, 'rgba(176,180,187,.2)');
    gr.addColorStop(1,          'rgba(176,180,187,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
    return s;
  }
  var NET = sprite(true), FLOU = sprite(false);

  var W = 0, H = 0, flocons = [];

  function semer(f, enHaut){
    f.z  = Math.pow(Math.random(), 1.7);          // la plupart au loin
    f.r  = 1.064 + f.z * f.z * 2.016;             // taille : 56 % de celle de l ancienne neige
    /* les lointains nets et discrets ; les proches plus gros mais presque
       transparents, flous : ils donnent la profondeur sans rien couvrir */
    f.a  = Math.min(1, 1.22 * (f.z > .62 ? .36 - (f.z - .62) * .4 : .42 + f.z * .4));   // un peu plus lisible
    f.x  = Math.random() * (W + 240) - 120;
    f.y  = enHaut ? -12 - Math.random() * 60 : Math.random() * H;
    f.v  = .8 + Math.random() * .45;             // chaque flocon a son poids
    f.ph = Math.random() * 6.283;
    f.fq = .5 + Math.random() * 1.3;             // son balancement
    f.am = 10 + Math.random() * 26;
    f.vx = 0; f.vy = 0;
    return f;
  }

  function dimensionner(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    var n = Math.min(MAX, Math.round(W * H / (1440 * 900) * DENSITE));
    while (flocons.length < n) flocons.push(semer({}, false));
    flocons.length = n;
  }
  dimensionner();
  window.addEventListener('resize', dimensionner);

  var force = CALME, rafale = 0, pouls = 0;       // valeurs lissees
  var ALLURE = 2;             // la musique joue : la tempete va deux fois plus vite
  var allure = 1;
  var fureur = 1;             // en plus, sur les pistes dechainees (TRACK_TEMPETE)
  var bpm = 100, horloge = 0, avant = performance.now();

  function lisser(v, but, dt, tau){ return v + (but - v) * (1 - Math.exp(-dt / tau)); }

  function image(now){
    requestAnimationFrame(image);
    var dt = Math.min(.05, (now - avant) / 1000);
    avant = now;
    if (!body.classList.contains('alb-paper')) return;   // les autres albums ont leur climat
    /* avant l apparition de la page le canevas est transparent : rien a dessiner */
    if (!body.classList.contains('is-stage') && !body.classList.contains('is-lighten')) return;

    /* le tempo et la place dans le morceau */
    var info = window.__trackInfo ? window.__trackInfo() : null;
    var joue = !!(info && info.joue);
    bpm = lisser(bpm, info ? info.bpm : 100, dt, .9);
    var k = Math.max(.7, Math.min(1.6, bpm / 100));
    /* musique en cours : on compte les temps sur la position de la piste,
       la poussee tombe donc toujours sur le temps du morceau */
    horloge = joue ? info.temps * bpm / 60 : horloge + dt * bpm / 60;
    var temps = horloge % 1;
    var p = Math.exp(-temps * 6);                             // la poussee du temps

    force  = lisser(force, joue ? 1 : CALME, dt, 1.2);
    allure = lisser(allure, joue ? ALLURE : 1, dt, 1.2);   // a l arret, la neige calme d avant
    fureur = lisser(fureur, joue ? (info.tempete || 1) : 1, dt, 1.2);
    rafale = lisser(rafale, joue ? SOUFFLE : 0, dt, 1.2);    // la tempete souffle sans relache
    pouls  = lisser(pouls, joue ? p : 0, dt, .06);

    var vent  = (VENT + RAFALE * rafale) * k * force * allure * fureur;
    var elan  = k * (.45 + .55 * force) * (1 + .45 * rafale + .12 * pouls) * allure * fureur;
    var t = now / 1000;

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);

    for (var i = 0; i < flocons.length; i++){
      var f = flocons[i];
      var prof = .35 + .65 * f.z;                            // le proche file plus vite
      /* tourbillons : dans les rafales la neige s enroule au lieu de
         filer tout droit */
      var tourb = Math.sin(f.y * .012 + t * 1.4 + f.ph) * 70 * rafale * force;
      f.vx = (vent + tourb) * prof + Math.cos(t * f.fq + f.ph) * f.am;
      f.vy = (CHUTE + CHUTE_PRES * f.z) * f.v * elan
           + Math.sin(f.x * .01 + t * 1.1 + f.ph) * 22 * rafale * force;
      f.x += f.vx * dt;
      f.y += f.vy * dt;

      if (f.y > H + 16) semer(f, true);
      if (f.x > W + 120) f.x -= W + 240;
      else if (f.x < -120) f.x += W + 240;

      /* pres et dans le vent, le flocon s etire dans le sens de sa course */
      var vit = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
      /* a peine etire, et pas davantage quand la tempete accelere : trop
         etire, on lirait de la pluie */
      var etire = 1 + Math.min(1.1, vit / (380 * allure * fureur)) * f.z * f.z;
      var ang = Math.atan2(f.vy, f.vx);
      var co = Math.cos(ang), si = Math.sin(ang), d = f.r * 2;
      g.globalAlpha = f.a;
      g.setTransform(co * etire * DPR, si * etire * DPR, -si * DPR, co * DPR, f.x * DPR, f.y * DPR);
      g.drawImage(f.z > .62 ? FLOU : NET, -d, -d, d * 2, d * 2);
    }
    etat = { bpm: bpm, force: force, rafale: rafale, vent: vent, fureur: fureur, flocons: flocons.length };
  }
  var etat = null;
  requestAnimationFrame(image);
  window.__tempete = function(){ return etat; };        // pour verifier le reglage
})();


/* ---------------- le disque tourne, avec l inertie d une platine ---------------- */
/* Un tour en 1,9 s, quelle que soit la piste. Comme une vraie platine, il
   prend sa vitesse et la quitte avec un peu d inertie : a la pause il
   s arrete en glissant, et il repart de la ou il s est arrete. */
(function(){
  var spin = document.getElementById('discSpin');
  if (!spin || REDUCED) return;
  spin.style.animation = 'none';                 // c est le script qui le fait tourner
  var TOUR = 1.9;                                // secondes par tour
  var body = document.body;
  var angle = 0, vit = 0, avant = performance.now();
  function image(now){
    requestAnimationFrame(image);
    var dt = Math.min(.05, (now - avant) / 1000); avant = now;
    var tourne = body.classList.contains('is-landed') &&
      (body.classList.contains('is-playing') || body.classList.contains('is-silent'));
    var cible = tourne ? 360 / TOUR : 0;                                         // degres par seconde
    vit += (cible - vit) * (1 - Math.exp(-dt / (cible > vit ? .35 : .6)));
    if (cible === 0 && vit < .3) vit = 0;
    if (!vit) return;
    angle = (angle + vit * dt) % 360;
    spin.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  }
  requestAnimationFrame(image);
  window.__platine = function(){ return { degresParSeconde: vit, secondesParTour: vit ? 360 / vit : null }; };
})();


/* ---------------- paroles synchronisees, facon Apple Music ---------------- */
(function(){

  var audio = document.getElementById('theme');
  var box   = document.getElementById('lyrics');
  var track = document.getElementById('lyrTrack');
  if (!audio || !box) return;

  /* la colonne est reconstruite a chaque changement de piste : une ligne par
     entree chantee, les entrees "music" restent des trous dans lines[] */
  var LYRICS = [];
  var lines  = [];
  var sung   = [];      // indices des lignes chantees, pour le mode reglage

  function buildLines(idx){
    var t = ALB().tracks[idx] || {};
    LYRICS = t.lyrics || [];
    track.innerHTML = '';
    lines = [];
    sung  = [];

    /* le petit rond de musique danse sur le tempo de la piste active */
    var bpm = t.bpm || 100;
    box.style.setProperty('--beat', (60 / bpm).toFixed(3) + 's');

    LYRICS.forEach(function(l, i){
      if (!l.text){ lines[i] = null; return; }

      var el = document.createElement('p');
      el.className = 'lyr';

      /* ce qui est entre parentheses est un choeur : plus petit et plus pale */
      var m = l.text.match(/^(.*?)\s*\((.+)\)\s*$/);
      if (m){
        el.appendChild(document.createTextNode(m[1]));
        var echo = document.createElement('span');
        echo.className = 'lyr-echo';
        echo.textContent = m[2];
        el.appendChild(echo);
      } else {
        el.textContent = l.text;
      }

      el.addEventListener('click', function(){
        target = 0; back = true; box.classList.remove('is-scrubbing');
        audio.currentTime = l.t + 0.02;
      });
      track.appendChild(el);
      lines[i] = el;
      sung.push(i);
    });
  }

  var current = -1;

  function activeAt(time){
    var n = -1;
    for (var i = 0; i < LYRICS.length; i++){ if (time >= LYRICS[i].t) n = i; else break; }
    return n;
  }

  /* la position affichee (pos) chasse en continu la position voulue (want),
     que ce soit le fil de la chanson ou le point pris a la molette : un seul
     ressort, toujours actif, donc jamais de saut brusque d une ligne a l autre,
     meme quand on revient de loin */
  var autoY = 0, pos = 0;

  function place(n){
    var el = lines[n];
    if (!el) return;                       // pendant l instrumental on ne bouge pas la colonne
    autoY = -(el.offsetTop + el.offsetHeight / 2 - box.clientHeight / 2);
  }

  /* La molette fait defiler le texte a la main, bute sur la premiere et la
     derniere ligne pour qu on ne parte jamais dans le vide, puis la chanson
     reprend la main en douceur apres une pause. */
  var target = 0, back = true, backTimer = 0;

  function bounds(){
    var first = null, last = null;
    for (var i = 0; i < lines.length; i++){
      if (!lines[i]) continue;
      if (!first) first = lines[i];
      last = lines[i];
    }
    if (!first) return [0, 0];
    var half = box.clientHeight / 2;
    var top    = half - (first.offsetTop + first.offsetHeight / 2);   // premiere ligne au centre
    var bottom = half - (last.offsetTop  + last.offsetHeight  / 2);   // derniere ligne au centre
    return [bottom, top];
  }

  function wanted(){
    var b = bounds();
    var base = back ? autoY : autoY + target;
    return Math.max(b[0], Math.min(b[1], base));
  }

  var ecrit = null;               // derniere position ecrite
  (function loop(){
    var w = wanted();
    pos += (w - pos) * 0.14;
    if (Math.abs(w - pos) < .3) pos = w;
    var y = pos.toFixed(1);
    if (y !== ecrit){ ecrit = y; track.style.transform = 'translateY(' + y + 'px)'; }
    requestAnimationFrame(loop);
  })();

  /* un seul chemin pour la molette et pour le doigt : on pousse le decalage,
     borne aux deux extremites, puis la chanson reprend la main apres la pause */
  function nudge(dy){
    var b = bounds();
    back = false;
    target = Math.max(b[0] - autoY, Math.min(b[1] - autoY, target + dy));
    box.classList.add('is-scrubbing');

    clearTimeout(backTimer);
    backTimer = setTimeout(function(){
      back = true; target = 0;                // la chanson reprend la main, en douceur
      box.classList.remove('is-scrubbing');
    }, 4000);
  }

  box.addEventListener('wheel', function(e){
    e.preventDefault();
    nudge(-e.deltaY * 0.7);
  }, {passive:false});

  /* au doigt : on suit le glissement, un pour un */
  var touchY = null;
  box.addEventListener('touchstart', function(e){
    touchY = e.touches[0].clientY;
  }, {passive:true});

  box.addEventListener('touchmove', function(e){
    if (touchY === null) return;
    var y = e.touches[0].clientY;
    nudge(y - touchY);
    touchY = y;
    e.preventDefault();                       // la page ne doit pas glisser derriere
  }, {passive:false});

  box.addEventListener('touchend', function(){ touchY = null; }, {passive:true});

  function paint(n){
    for (var i = 0; i < lines.length; i++){
      if (!lines[i]) continue;
      lines[i].classList.toggle('is-now',  i === n);
      lines[i].classList.toggle('is-past', i <  n);
    }
  }

  function apply(n){
    var quiet = !!(n < 0 || (LYRICS[n] && LYRICS[n].music));   // sans le double !, toggle bascule au lieu d eteindre
    box.classList.toggle('is-quiet', quiet);   // le texte s enfonce, la note apparait
    if (!quiet){ paint(n); place(n); }
    else paint(n);
  }

  function check(){
    if (!LYRICS.length) return;
    var n = activeAt(audio.currentTime);
    if (n !== current){ current = n; apply(n); }
  }

  function tick(){ check(); requestAnimationFrame(tick); }

  /* appele quand on change de piste depuis le dock : reconstruit la colonne
     avec les paroles de la nouvelle piste (vide si elle n en a pas encore) */
  window.__setLyricsTrack = function(idx){
    buildLines(idx);
    current = -1;
    autoY = 0; pos = 0; target = 0; back = true;
    box.classList.remove('is-scrubbing');
    apply(-1);
  };

  buildLines(ALB().start);   // la piste qui ouvre l album
  apply(-1);
  audio.addEventListener('timeupdate', check);   // filet de securite si les images sont bridees
  audio.addEventListener('seeked', check);
  audio.addEventListener('play', check);
  requestAnimationFrame(tick);

  /* ---- mode reglage : on pose les temps en tapant sur la barre d espace ---- */
  var tuning = false, cursor = 0, stamps = [];

  /* la lecture doit savoir si le reglage tient la barre d espace */
  window.__lyricsTuning = function(){ return tuning; };

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();

    if (k === 'l'){
      tuning = !tuning; cursor = 0; stamps = [];
      box.classList.toggle('is-tuning', tuning);
      return;
    }
    if (!tuning) return;

    if (e.code === 'Space'){
      e.preventDefault();
      var idx = sung[cursor];
      stamps.push([idx, +audio.currentTime.toFixed(2)]);
      cursor = Math.min(sung.length - 1, cursor + 1);
      current = idx; apply(idx);
    }

    if (k === 'e'){
      var out = stamps.map(function(p){
        return '    { t: ' + p[1].toFixed(2) + ', text: "' + LYRICS[p[0]].text.replace(/"/g, '\\"') + '" }';
      }).join(',' + '\n');
      out = 'var LYRICS = [' + '\n' + out + '\n  ];';
      console.log(out);
      if (navigator.clipboard) navigator.clipboard.writeText(out);
    }
  });

  window.__lyrics = function(){
    return {current: current, quiet: box.classList.contains('is-quiet'), lines: track.children.length};
  };
})();

/* ---------------- choix de l album ---------------- */
(function(){
  /* Changer d album refait toute la page : le disque, la pochette, le decor,
     la rangee des pistes et les paroles. Un seul clic, un seul chemin. */
  var box    = document.getElementById('albums');
  var disc   = document.querySelector('.disc');
  var sleeve = document.querySelector('.sleeve');
  var audio  = document.getElementById('theme');
  if (!box || !disc) return;

  /* on charge les images de l album voisin a l avance : au clic, le disque
     change d un coup au lieu de clignoter en blanc le temps du telechargement */
  ALBUMS.forEach(function(a){
    [a.disc, a.cover].forEach(garderImage);
  });

  var items = ALBUMS.map(function(a, i){
    var el = document.createElement('button');
    el.type = 'button';
    /* la pastille porte le decor de SON album, pas celui de la page ouverte :
       c est a sa couleur qu on reconnait l album vers lequel on va */
    el.className = 'alb alb-t-' + a.theme;
    el.setAttribute('aria-label', a.title + ' - ' + a.by);
    el.innerHTML =
      '<span class="bub">' +
        '<span class="bub-glass"></span>' +
        '<img class="bub-art" src="' + a.thumb + '" alt="">' +
      '</span>' +
      '<span class="alb-name">' + a.title + '</span>';
    el.addEventListener('click', function(){
      /* avant que la page n apparaisse, la pastille n est pas la (Entree au
         clavier sur une pastille encore invisible lancait sa musique) */
      if (!document.body.classList.contains('is-stage')) return;
      var son = (i !== CUR_ALBUM && window.__ui) ? window.__ui('album') : 0;
      pick(i, son);
    });
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });   // l espace reste a la lecture
    /* seulement une vraie souris : un doigt envoie aussi un survol juste
       avant son clic, et les deux sons partiraient ensemble */
    el.addEventListener('pointerenter', function(e){
      if (e.pointerType === 'mouse' && window.__ui) window.__ui('albumHover');
    });
    box.appendChild(el);
    return el;
  });

  /* Les pastilles ne sont plus la d office : un bouton a barres, comme celui
     du choix du disque (une barre par album, la plus longue pour celui qui
     est ouvert), les fait monter du bas ; un clic ailleurs ou Echap les
     range. Choisir un album les range aussi. */
  var bouton = document.getElementById('albumsBtn');
  function barres(){
    if (!bouton) return;
    bouton.innerHTML = ALBUMS.map(function(a, j){
      return '<i' + (j === CUR_ALBUM ? ' class="on"' : '') + '></i>';
    }).join('');
  }
  function montrerAlbums(v){
    document.body.classList.toggle('is-albums', !!v);
    if (bouton) bouton.setAttribute('aria-expanded', v ? 'true' : 'false');
  }
  if (bouton){
    barres();
    bouton.addEventListener('click', function(e){
      e.stopPropagation();
      montrerAlbums(!document.body.classList.contains('is-albums'));
    });
    bouton.addEventListener('mousedown', function(e){ e.preventDefault(); });   // l espace reste a la lecture
    document.addEventListener('click', function(e){
      if (!document.body.classList.contains('is-albums')) return;
      if (box.contains(e.target) || bouton.contains(e.target)) return;
      montrerAlbums(false);
    });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') montrerAlbums(false); });
  }

  /* son : le temps que met le son de changement d album a se taire ; la
     premiere piste part juste apres lui, pas en meme temps */
  /* attendre : l album est pose, sa piste chargee, mais rien ne part — c est
     le cas quand on le choisit sur la page du choix, avant l ecran d accueil */
  var signe = document.getElementById('introLogo');
  function pick(i, son, attendre){
    if (i === CUR_ALBUM || !ALBUMS[i]) return;
    CUR_ALBUM = i;
    var a = ALBUMS[i];

    disc.src = a.disc;
    if (sleeve) sleeve.src = a.cover;
    /* le signe de l ecran d accueil, pour les albums qui en ont un */
    if (signe && a.sign) signe.src = a.sign;
    items.forEach(function(el, j){ el.classList.toggle('is-current', j === i); });
    barres(); montrerAlbums(false);        // l album choisi : les pastilles se rangent

    /* le decor de la page suit l album : une seule classe sur le corps,
       la feuille de style s occupe du reste */
    ALBUMS.forEach(function(o){ document.body.classList.remove('alb-' + o.theme); });
    document.body.classList.add('alb-' + a.theme);
    /* un album sans fichiers cache ce qui ne sert qu au son : la colonne des
       paroles et les commandes de lecture */
    document.body.classList.toggle('is-silent', !!a.silent);

    /* la rangee du haut est refaite avec les pistes du nouvel album, puis
       celle qui l ouvre demarre : c est elle qu on veut entendre en arrivant */
    if (window.__dockBuild) window.__dockBuild();
    /* Le film d ouverture se joue en silence : la premiere piste est
       chargee tout de suite, mais elle ne part qu une fois la page revenue.
       Si le film n a pas lieu (animations reduites), elle part aussitot. */
    var enFilm = false;
    if (window.__intro){
      if (a.intro) enFilm = window.__intro.jouer();
      else window.__intro.couper();
    }
    if (window.__playTrack) window.__playTrack(a.start, true, enFilm || !!attendre, son);
  }

  items[0].classList.add('is-current');
  document.body.classList.add('alb-' + ALBUMS[0].theme);
  document.body.classList.toggle('is-silent', !!ALBUMS[0].silent);
  window.__setAlbum   = pick;
  window.__albumState = function(){
    return {current: CUR_ALBUM, total: ALBUMS.length, track: ALB().start};
  };
})();

/* ---------------- l ouverture filmee de la page de Jane ---------------- */
(function(){
  /* Le film se pose exactement la ou est le fond : meme echelle que cover,
     meme position de derive. Sa derniere image tombe alors pile sur le fond,
     et le fondu qui la remplace ne montre aucun decalage. */
  var body = document.body;
  var deco = document.querySelector('.deco');
  var vid  = document.getElementById('jrIntro');
  var skip = document.getElementById('skipIntro');
  if (!deco || !vid || !skip) return;

  var W = 1895, H = 830;     // le fond de la page
  var HV = 812;              // la bande 21:9 que le film en garde, centree
  /* la derive du fond repart de 38 % a chaque arrivee sur l album ; au bout
     des cinq secondes du film, sur une courbe ease-in-out de 64 secondes,
     elle en est a 38,3 %. Le film se cale sur cette valeur, celle du raccord. */
  var DERIVE = .383;

  var en_cours = false, filet = 0, musique = 0;
  /* La musique part a l instant ou la page commence a revenir, pas apres.
     Le bouton de lecture ne reapparait qu une seconde plus tard (son delai
     dans la cascade) : il se montre donc deja dans l etat « en lecture ».
     Lancer la piste une fois la page revenue le faisait surgir sur l icone
     de lecture, puis basculer d un coup quand la musique partait. */
  var APRES_RETOUR = 0;

  function caler(){
    var r = deco.getBoundingClientRect();
    var k = Math.max(r.width / W, r.height / H);      // la regle de cover
    var w = W * k, hv = HV * k;
    vid.style.width  = w.toFixed(1) + 'px';
    vid.style.height = hv.toFixed(1) + 'px';
    vid.style.left   = ((r.width - w) * DERIVE).toFixed(1) + 'px';
    vid.style.top    = ((r.height - hv) / 2).toFixed(1) + 'px';
  }

  /* la page renait : is-stage rendu, chaque piece reprend ses propres delais,
     exactement comme a la premiere visite */
  function finir(avecMusique){
    if (!en_cours) return;
    en_cours = false;
    clearTimeout(filet);
    body.classList.remove('is-intro');
    body.classList.add('is-stage');
    clearTimeout(musique);
    if (avecMusique === true){
      musique = setTimeout(function(){
        /* seulement si l on est toujours sur l album du film */
        if (ALB().intro && window.__playNow) window.__playNow();
      }, APRES_RETOUR);
    }
  }
  function finirEnMusique(){ finir(true); }

  /* rend vrai si le film a bien lieu : la musique attendra alors sa fin */
  function jouer(){
    clearTimeout(musique);
    /* le film est coupe pour l instant : son affiche n est chargee qu ici,
       le jour ou il resservira */
    if (!vid.getAttribute('poster') && vid.dataset.poster) vid.setAttribute('poster', vid.dataset.poster);
    /* le systeme demande le calme : pas de film, la page arrive directement */
    if (REDUCED) return false;
    en_cours = true;
    caler();
    body.classList.remove('is-stage');     // l interface rentre dans le fond
    body.classList.add('is-intro');
    try { vid.currentTime = 0; } catch (e) {}
    var p = vid.play();
    /* si le navigateur refuse la lecture, on ne laisse pas la page vide */
    if (p && p.catch) p.catch(finirEnMusique);
    clearTimeout(filet);
    filet = setTimeout(finirEnMusique, 9000);   // filet, si la fin n est jamais signalee
    return true;
  }

  /* on quitte l album pendant le film, ou juste apres : il s arrete, la page
     revient, et la musique attendue n est plus lancee — c est le nouvel
     album qui choisit la sienne */
  function couper(){
    clearTimeout(musique);
    if (!en_cours) return;
    vid.pause();
    finir(false);
  }

  function passer(e){
    if (e) e.stopPropagation();
    vid.pause();
    finir(true);
  }

  vid.addEventListener('ended', finirEnMusique);
  /* Le filet de neuf secondes part au clic, pour le cas ou le film ne
     demarrerait jamais. Mais sur un reseau lent le film peut commencer avec
     du retard, et le filet couperait alors sa fin : des que la lecture
     commence vraiment, on le recale sur ce qui reste a jouer. */
  vid.addEventListener('playing', function(){
    if (!en_cours) return;
    clearTimeout(filet);
    var reste = (vid.duration || 5.04) - vid.currentTime;
    filet = setTimeout(finirEnMusique, (reste + 2) * 1000);
  });
  skip.addEventListener('click', passer);
  window.addEventListener('keydown', function(e){
    if (en_cours && e.key === 'Escape') passer();
  });
  window.addEventListener('resize', function(){ if (en_cours) caler(); });

  window.__intro = { jouer: jouer, couper: couper };
})();

/* ---------------- arrivee du disque, impact, puis lecture en boucle ---------------- */
(function(){
  var LAND = 4000;                       // instant ou le disque touche le plateau, ms (= duree des animations d intro)

  var body  = document.body;
  var fly   = document.getElementById('discFly');
  var deck  = document.querySelector('.deck');
  var audio = document.getElementById('theme');
  var btn   = document.getElementById('sound');
  var vol   = document.getElementById('vol');

  audio.volume = vol.value / 100;
  vol.addEventListener('input', function(){
    audio.volume = vol.value / 100;
    vol.style.setProperty('--v', vol.value + '%');
    /* le son coupe dans le choix du disque se rallume ici : sans cela la
       musique restait muette et rien sur la page ne la rendait */
    if (audio.muted) audio.muted = false;
  });
  vol.style.setProperty('--v', vol.value + '%');

  /* le disque doit venir du centre de l ecran, bien droit : on mesure l ecart
     entre le centre du plateau et le centre de la fenetre, puis on annule la
     rotation de la platine pour que la trajectoire reste verticale a l ecran */
  var platter = document.querySelector('.platter');

  function aim(){
    var r  = platter.getBoundingClientRect();    // repere fixe : le disque, lui, bouge
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var vw = window.innerWidth, vh = window.innerHeight;

    var deg = 0;
    var m = getComputedStyle(deck).transform;
    if (m && m !== 'none'){
      var v = m.slice(m.indexOf('(') + 1, -1).split(',');
      deg = Math.atan2(parseFloat(v[1]), parseFloat(v[0]));
    }
    var c = Math.cos(-deg), s = Math.sin(-deg);

    /* la scene est mise a l echelle : on repasse les ecarts en unites de scene,
       puis on annule la rotation de la platine pour que la trajectoire reste
       droite a l ecran */
    var k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1;

    function put(name, sx, sy){
      var dx = (sx - cx) / k, dy = (sy - cy) / k;
      fly.style.setProperty('--' + name + 'x', (dx * c - dy * s).toFixed(1) + 'px');
      fly.style.setProperty('--' + name + 'y', (dx * s + dy * c).toFixed(1) + 'px');
    }

    put('f', vw * 0.50, vh * 0.50);   // le disque se revele au centre, sous le signe

    aimWave(cx, cy);   // l onde partira de la, c est a dire du disque pose
  }

     ce centre : c est la distance au coin le plus eloigne. Sans ce calcul,
     l onde finirait sa course bien avant la fin de l animation (ou apres). */
  function aimWave(cx, cy){
    var vw = window.innerWidth, vh = window.innerHeight;
    var need = Math.max(
      Math.sqrt(cx * cx + cy * cy),
      Math.sqrt((vw - cx) * (vw - cx) + cy * cy),
      Math.sqrt(cx * cx + (vh - cy) * (vh - cy)),
      Math.sqrt((vw - cx) * (vw - cx) + (vh - cy) * (vh - cy))
    );
    var s = document.body.style;
    s.setProperty('--ox', cx.toFixed(0) + 'px');
    s.setProperty('--oy', cy.toFixed(0) + 'px');
    s.setProperty('--wr', Math.ceil(need) + 'px');

     d espace. Ce geste ouvre aussi le son, que le navigateur refuse tant que
     la page n en a recu aucun. */

  var wanted  = true;
  var started = false;

  function paintBtn(){
    btn.classList.toggle('is-paused', audio.paused);
    btn.classList.toggle('is-waiting',

  }

    if (!wanted || !audio.getAttribute('src')) return;   // album muet : rien a lancer

     de tourner sans repasser par l intro */
  var trackIdx = ALB().start;
  /* le lecteur arrive charge d une piste dans le balisage : c est celle qui
     ouvre l album qui doit y etre */
  (function(){
    var t = ALB().tracks[trackIdx];
    if (t && t.audio && audio.getAttribute('src') !== t.audio) audio.src = t.audio;
  })();

  /* la piste choisie attend la fin du son de choix pour partir ; tout autre
     geste sur la lecture entre temps annule ce depart differe */
  var apresSon = 0;
  function annulerApresSon(){ clearTimeout(apresSon); apresSon = 0; }

     attendre : la piste est chargee et marquee, mais elle ne part pas ;

     entierement revenue */
  window.__playTrack = function(idx, force, attendre, delai){

    var t = ALB().tracks[idx];
    if (!t || (idx === trackIdx && !force)) return;

       Poser une source vide ferait recharger la page elle meme comme un son,
       donc on retire l attribut au lieu de le vider. */

      audio.removeAttribute('src');
      audio.load();
      if (window.__setLyricsTrack) window.__setLyricsTrack(idx);
      if (window.__dockMark) window.__dockMark(idx);
      paintBtn();

    if (window.__dockMark) window.__dockMark(idx);

       ne repart qu une fois qu il s est tu. Si elle jouait deja, aucun son
       n a sonne et elle enchaine tout de suite. */
    if (!wasPlaying && force && delai > 0){ partirApres(delai); }

  var sonSurvolSigne = new Audio('assets/ui_logo_hover.mp3');
  sonSurvolSigne.preload = 'auto';
  /* et celui de l eclipse (PS2, « Bootup ») : il accompagne l apparition du
     disque et s efface de lui meme sous la musique, a l atterrissage */
  var sonEclipse = new Audio('assets/ui_boot.mp3?v=5');
  sonEclipse.preload = 'auto';
  var BOUM = 1.05;                       // le coup sourd du « Bootup », s apres le clic (un temps de Yes, You May)

  /* L ambiance de l ecran d accueil (PS4, « Main ») : elle monte doucement
     tant qu on n est pas parti, puis s eteint en douceur au clic sur le

     morceau, le second repart du debut pendant que le premier s efface ;
     la boucle ne s entend pas. Un navigateur ne la laisse jouer que si la

     page du site ; sinon elle reste muette, sans rien empecher. */
  var AMBIANCE = 'assets/ambiance.mp3';

    amb = { lecteurs: [new Audio(AMBIANCE), new Audio(AMBIANCE)], actif: 0, niveau: 0, cible: 0, fini: false };
    /* le second lecteur ne sert qu a la boucle, une minute plus tard : le
       charger tout de suite doublait le telechargement du morceau */
    amb.lecteurs.forEach(function(l, i){ l.preload = body.classList.contains('is-picking') || i ? 'none' : 'auto'; l.volume = 0; });

    function battre(){                                       // marche aussi onglet cache
      /* le niveau general va vers sa cible (montee, extinction) */
      var k = Math.min(1, (performance.now() - t0) / duree);
      amb.niveau = de + (amb.cible - de) * (k * k * (3 - 2 * k));
      var a = amb.lecteurs[amb.actif], b = amb.lecteurs[1 - amb.actif];

        var p2 = amb.lecteurs[amb.actif].play();

    }

      body.classList.add('sans-eclipse');        // pas de film sur telephone
